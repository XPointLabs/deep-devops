services:
  membership-fixture:
    command: [--advertised-host, "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}", --advertised-scheme, https]

  xnode-1: { ports: !reset [] }
  xnode-2: { ports: !reset [] }
  xnode-3: { ports: !reset [] }
  xnode-4: { ports: !reset [] }
  xnode-5: { ports: !reset [] }
  xnode-6: { ports: !reset [] }
  registry: { ports: !reset [] }
  storage: { ports: !reset [] }
  file: { ports: !reset [] }
  push: { ports: !reset [] }

  turn:
    image: coturn/coturn:4.12.0-alpine@sha256:faca4aa57efc436916c31546f3867bd1a3fb1077723291bcfba0bf814bcaf48a
    platform: linux/arm64
    init: true
    restart: unless-stopped
    read_only: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    entrypoint: [/usr/local/bin/deep-coturn-entrypoint]
    environment:
      DEEP_TURN_PUBLIC_HOST: ${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}
      DEEP_TURN_EXTERNAL_IP: ${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}
      DEEP_TURN_CERT_FILE: /run/deep-uat-tls/server.crt
      DEEP_TURN_PKEY_FILE: /run/deep-uat-tls/server.key
      DEEP_TURN_SHARED_SECRET_FILE: /run/secrets/turn-shared-secret
    tmpfs:
      - /run/coturn-runtime:rw,noexec,nosuid,nodev,size=1m,mode=0700
    ports:
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:3478:3478/tcp"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:3478:3478/udp"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:5349:5349/tcp"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:5349:5349/udp"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:49160-49200:49160-49200/tcp"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:49160-49200:49160-49200/udp"
    volumes:
      - ./config/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./scripts/coturn-entrypoint.sh:/usr/local/bin/deep-coturn-entrypoint:ro
      - ${SURVIVAL_UAT_TLS_SECRET_DIR:?set SURVIVAL_UAT_TLS_SECRET_DIR}/server.crt:/run/deep-uat-tls/server.crt:ro
      - ${SURVIVAL_UAT_TLS_SECRET_DIR:?set SURVIVAL_UAT_TLS_SECRET_DIR}/server.key:/run/deep-uat-tls/server.key:ro
    secrets:
      - source: turn-shared-secret
        target: turn-shared-secret
    networks: [runtime]
    healthcheck:
      test: [CMD-SHELL, "pidof turnserver >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s

  survival-uat-tls-ingress:
    image: haproxy:3.2.22-alpine3.24@sha256:79799e8b2977e60802774fa53d29e6b54e045402cdd8a8b9fe43923e7095a047
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      # The supported chaos overlay changes only this private backend name.
      # The public listener, certificate, route ACLs, and port remain identical.
      DEEP_UAT_XNODE_1_UPSTREAM: xnode-1:8082
      DEEP_UAT_XNODE_3_UPSTREAM: xnode-3:8082
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"]
    ports:
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41801:41801"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41802:41802"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41803:41803"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41804:41804"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41805:41805"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41806:41806"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41810:41810"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41821:41821"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41822:41822"
      - "${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41823:41823"
    volumes:
      - type: bind
        source: ${DEEP_PHYSICAL_E2E_HAPROXY_CONFIG_PATH:-./config/survival-uat-tls/haproxy.cfg}
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
      - ${SURVIVAL_UAT_TLS_SECRET_DIR:?set SURVIVAL_UAT_TLS_SECRET_DIR}/server.pem:/run/deep-uat-tls/server.pem:ro
    networks: { runtime: { ipv4_address: 172.30.82.7 } }
    depends_on:
      xnode-1: { condition: service_healthy }
      xnode-2: { condition: service_healthy }
      xnode-3: { condition: service_healthy }
      xnode-4: { condition: service_healthy }
      xnode-5: { condition: service_healthy }
      xnode-6: { condition: service_healthy }
      registry: { condition: service_healthy }
      file: { condition: service_healthy }
      push: { condition: service_healthy }
      turn: { condition: service_healthy }

  survival-uat-crl:
    image: node:24-alpine@sha256:f70403e87646dc51b45295f4b8b70cdad0b63d2297c4c9899119b03f7af7a6b3
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777"]
    ports: ["${SURVIVAL_BIND_HOST:?set SURVIVAL_BIND_HOST}:41824:8080"]
    volumes:
      - ${SURVIVAL_UAT_TLS_SECRET_DIR:?set SURVIVAL_UAT_TLS_SECRET_DIR}/public:/public:ro
    command:
      - node
      - --eval
      - |
        const http=require('node:http'),fs=require('node:fs');
        const body=fs.readFileSync('/public/deep-physical-uat-ca.crl');
        http.createServer((req,res)=>{
          if(req.method!=='GET'||req.url!=='/deep-physical-uat-ca.crl'){res.writeHead(404);res.end();return}
          res.writeHead(200,{'Content-Type':'application/pkix-crl','Content-Length':body.length,'Cache-Control':'public,max-age=3600'});
          res.end(body)
        }).listen(8080,'0.0.0.0');

secrets:
  turn-shared-secret:
    file: ${SURVIVAL_UAT_TLS_SECRET_DIR:?set SURVIVAL_UAT_TLS_SECRET_DIR}/turn-shared-secret
