name: ${P15_PROJECT_NAME:?P15_PROJECT_NAME must be a unique p15a namespace}

x-p15-labels: &p15-labels
  org.opencontainers.image.revision: ${P15_SOURCE_SHA:?P15_SOURCE_SHA is required}
  org.opencontainers.image.source: deep-devops
  com.xpoint.evidence-class: compatibility-lab
  com.xpoint.product-runtime: "false"

x-p15-service: &p15-service
  image: ${P15_IMAGE_NAME:?P15_IMAGE_NAME is required}
  pull_policy: never
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m
  networks:
    - lab
  restart: "no"

x-p15-health: &p15-health
  interval: 2s
  timeout: 2s
  retries: 15
  start_period: 1s

services:
  storage:
    <<: *p15-service
    profiles:
      - p15-compat-core
      - p15-compat-probe
      - p15-compat-faults
    build:
      context: .
      pull: false
      args:
        NODE_IMAGE: ${P15_BASE_IMAGE:?P15_BASE_IMAGE is required}
        P15_SOURCE_SHA: ${P15_SOURCE_SHA}
        P15_SOURCE_TREE: ${P15_SOURCE_TREE:?P15_SOURCE_TREE is required}
        P15_CONTEXT_SHA256: ${P15_CONTEXT_SHA256:?P15_CONTEXT_SHA256 is required}
        P15_OWNERSHIP_NONCE: ${P15_OWNERSHIP_NONCE:?P15_OWNERSHIP_NONCE is required}
      labels:
        <<: *p15-labels
        com.xpoint.p15.source-tree: ${P15_SOURCE_TREE}
        com.xpoint.p15.base-image-digest: ${P15_BASE_IMAGE}
        com.xpoint.p15.context-sha256: ${P15_CONTEXT_SHA256}
        com.xpoint.p15.ownership-nonce: ${P15_OWNERSHIP_NONCE:?P15_OWNERSHIP_NONCE is required}
      dockerfile_inline: |
        ARG NODE_IMAGE
        FROM $${NODE_IMAGE}
        ARG P15_SOURCE_SHA
        ARG P15_SOURCE_TREE
        ARG P15_CONTEXT_SHA256
        ARG P15_OWNERSHIP_NONCE
        LABEL org.opencontainers.image.revision="$${P15_SOURCE_SHA}" \
              org.opencontainers.image.source="deep-devops" \
              com.xpoint.evidence-class="compatibility-lab" \
              com.xpoint.product-runtime="false" \
              com.xpoint.p15.source-tree="$${P15_SOURCE_TREE}" \
              com.xpoint.p15.context-sha256="$${P15_CONTEXT_SHA256}" \
              com.xpoint.p15.ownership-nonce="$${P15_OWNERSHIP_NONCE}" \
              com.xpoint.p15.base-image-digest="$${NODE_IMAGE}"
        WORKDIR /service
        COPY --chown=node:node tools/compat-services ./tools/compat-services
        COPY --chown=node:node tools/storage-service ./tools/storage-service
        COPY --chown=node:node tools/file-service ./tools/file-service
        COPY --chown=node:node tools/push-service ./tools/push-service
        COPY --chown=node:node tools/calls-service ./tools/calls-service
        COPY --chown=node:node scripts/p15-compat-contracts.mjs ./scripts/p15-compat-contracts.mjs
        COPY --chown=node:node scripts/p15-evidence-sanitizer.mjs ./scripts/p15-evidence-sanitizer.mjs
        RUN mkdir /state && chown node:node /state
        USER node
    command:
      - node
      - tools/storage-service/storage-service.mjs
    environment:
      PORT: "8080"
      SERVICE_NAME: p15-storage-compat
      COMPAT_STATE_DIR: /state
    labels:
      <<: *p15-labels
      com.xpoint.p15.service-identity: p15-storage-compat
    volumes:
      - storage-state:/state
    healthcheck:
      <<: *p15-health
      test:
        - CMD
        - node
        - --eval
        - >-
          fetch('http://127.0.0.1:8080/health/ready')
          .then(r=>r.ok?r.json():Promise.reject())
          .then(v=>{if(v.ok!==true||v.service!=='p15-storage-compat')process.exit(1)})
          .catch(()=>process.exit(1))

  file:
    <<: *p15-service
    profiles:
      - p15-compat-core
      - p15-compat-probe
      - p15-compat-faults
    command:
      - node
      - tools/file-service/file-service.mjs
    environment:
      PORT: "8080"
      SERVICE_NAME: p15-file-compat
      COMPAT_STATE_DIR: /state
    labels:
      <<: *p15-labels
      com.xpoint.p15.service-identity: p15-file-compat
    volumes:
      - file-state:/state
    healthcheck:
      <<: *p15-health
      test:
        - CMD
        - node
        - --eval
        - >-
          fetch('http://127.0.0.1:8080/health/ready')
          .then(r=>r.ok?r.json():Promise.reject())
          .then(v=>{if(v.ok!==true||v.service!=='p15-file-compat')process.exit(1)})
          .catch(()=>process.exit(1))

  push:
    <<: *p15-service
    profiles:
      - p15-compat-core
      - p15-compat-probe
      - p15-compat-faults
    command:
      - node
      - tools/push-service/push-service.mjs
    environment:
      PORT: "8080"
      SERVICE_NAME: p15-push-compat
      COMPAT_STATE_DIR: /state
    labels:
      <<: *p15-labels
      com.xpoint.p15.service-identity: p15-push-compat
    volumes:
      - push-state:/state
    healthcheck:
      <<: *p15-health
      test:
        - CMD
        - node
        - --eval
        - >-
          fetch('http://127.0.0.1:8080/health/ready')
          .then(r=>r.ok?r.json():Promise.reject())
          .then(v=>{if(v.ok!==true||v.service!=='p15-push-compat')process.exit(1)})
          .catch(()=>process.exit(1))

  calls:
    <<: *p15-service
    profiles:
      - p15-compat-core
      - p15-compat-probe
      - p15-compat-faults
    command:
      - node
      - tools/calls-service/calls-service.mjs
    environment:
      PORT: "8080"
      SERVICE_NAME: p15-calls-compat
      CALLS_STATE_DIR: /state
    labels:
      <<: *p15-labels
      com.xpoint.p15.service-identity: p15-calls-compat
    volumes:
      - calls-state:/state
    healthcheck:
      <<: *p15-health
      test:
        - CMD
        - node
        - --eval
        - >-
          fetch('http://127.0.0.1:8080/health/ready')
          .then(r=>r.ok?r.json():Promise.reject())
          .then(v=>{if(v.ok!==true||v.service!=='p15-calls-compat')process.exit(1)})
          .catch(()=>process.exit(1))

  probe:
    <<: *p15-service
    profiles:
      - p15-compat-probe
      - p15-compat-faults
    command:
      - node
      - scripts/p15-compat-contracts.mjs
      - probe
      - health
    environment:
      P15_PROBE_ROLE: p15-internal-black-box-probe
      P15_NETWORK_CLASS: internal-only
    labels:
      <<: *p15-labels
      com.xpoint.p15.service-identity: p15-internal-black-box-probe
    healthcheck:
      <<: *p15-health
      test:
        - CMD
        - node
        - --eval
        - >-
          if(process.env.P15_PROBE_ROLE!=='p15-internal-black-box-probe'||
          process.env.P15_NETWORK_CLASS!=='internal-only')process.exit(1)

networks:
  lab:
    internal: true
    labels:
      com.xpoint.evidence-class: compatibility-lab
      com.xpoint.product-runtime: "false"

volumes:
  storage-state:
    labels:
      com.xpoint.evidence-class: compatibility-lab
      com.xpoint.product-runtime: "false"
  file-state:
    labels:
      com.xpoint.evidence-class: compatibility-lab
      com.xpoint.product-runtime: "false"
  push-state:
    labels:
      com.xpoint.evidence-class: compatibility-lab
      com.xpoint.product-runtime: "false"
  calls-state:
    labels:
      com.xpoint.evidence-class: compatibility-lab
      com.xpoint.product-runtime: "false"
