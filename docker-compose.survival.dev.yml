name: deep-survival-dev

x-service: &service
  platform: linux/arm64
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [runtime]
  labels:
    com.xpoint.survival.stack: dev

x-health: &health
  interval: 3s
  timeout: 2s
  retries: 60
  start_period: 10s

x-xnode-build: &xnode-build
  context: .
  pull: false
  additional_contexts:
    xnode_source: ${SURVIVAL_XNODE_BUILD_CONTEXT:-./artifacts/survival-dev/build-contexts/xnode}
  args:
    SDK_IMAGE: ${SURVIVAL_DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk@sha256:7e964ea8bc6c1e18ea9fbc76ed403da41c9b19aeee2aab6bf9c845f25e891380}
    RUNTIME_IMAGE: ${SURVIVAL_DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet@sha256:e3736b0d423db99c6988e1ddf5ea725c14b12579bb120024e5ff7ff204a14080}
    XNODE_REVISION: 00280a643cfdc1e0780147eceb1da5c7b6fd2799
    XNODE_SOURCE_CONTEXT_MANIFEST_SHA256: bd8cb5a16fb1d396716adc14d0adf95b005c0cccdf476cffd1cd65e5938aa102
  dockerfile_inline: |
    ARG SDK_IMAGE
    ARG RUNTIME_IMAGE
    FROM $${SDK_IMAGE} AS build
    ARG XNODE_REVISION
    ARG XNODE_SOURCE_CONTEXT_MANIFEST_SHA256
    WORKDIR /src
    COPY --from=xnode_source . .
    RUN printf '%s  %s\n' "$${XNODE_SOURCE_CONTEXT_MANIFEST_SHA256}" .survival-source-manifest.json | sha256sum -c -
    RUN set -eu; for attempt in 1 2 3; do \
          if dotnet restore src/XNode/XNode.csproj --locked-mode > /tmp/xnode-restore.log 2>&1; then \
            cat /tmp/xnode-restore.log; rm -f /tmp/xnode-restore.log; break; \
          fi; \
          cat /tmp/xnode-restore.log >&2; \
          if ! grep -Eiq 'ResponseEnded|unexpected EOF|end of file|connection reset|connection refused|temporar(y|ily) unavailable|temporary failure|timed out|timeout|NU1301|HTTP status (408|429|500|502|503|504)' /tmp/xnode-restore.log; then \
            rm -f /tmp/xnode-restore.log; exit 1; \
          fi; \
          if [ "$$attempt" = "3" ]; then rm -f /tmp/xnode-restore.log; exit 1; fi; \
          rm -f /tmp/xnode-restore.log; sleep $$((attempt * 10)); \
        done
    RUN dotnet publish src/XNode/XNode.csproj -c Debug -o /out --runtime linux-arm64 --self-contained false -p:UseAppHost=false --no-restore
    FROM $${RUNTIME_IMAGE}
    ARG XNODE_REVISION
    ARG XNODE_SOURCE_CONTEXT_MANIFEST_SHA256
    LABEL org.opencontainers.image.revision=$${XNODE_REVISION} \
          com.xpoint.source-context.manifest-sha256=$${XNODE_SOURCE_CONTEXT_MANIFEST_SHA256}
    WORKDIR /app
    COPY --from=build /out .
    RUN mkdir /state && chown 65532:65532 /state
    USER 65532:65532
    ENTRYPOINT ["dotnet","XNode.dll"]

x-xnode: &xnode
  <<: *service
  image: deep-survival/xnode:dev
  # This file is generated locally by the supported launcher from the pinned
  # XNode source. It carries only DEV-LOCAL-ONLY public MIP1/RIP1 authority
  # material and the exact placement-pair allowlist; it is not client authority.
  env_file:
    - ${SURVIVAL_MAILBOX_AUTHORITY_ENV:-./artifacts/survival-dev/mailbox-peer-authority.env}
  environment: &xnode-environment
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://0.0.0.0:8080
    Node__ApiListenUrl: http://0.0.0.0:8080
    Node__PeerRpcListenUrl: http://0.0.0.0:8081
    Node__ManagedIngressH2ListenUrl: http://0.0.0.0:8082
    Node__PrivacyPeerH2ListenUrl: http://0.0.0.0:8083
    Node__ManagedIngressTrustedProxyAddresses__0: 172.30.82.7
    Node__ManagedIngressTrustedProxyAddresses__1: 172.30.82.8
    Node__DataDirectory: /state
    Node__Network: local
    Node__PublicPort: "8080"
    PrivacyRouting__Enabled: "true"
    PrivacyRouting__X25519PrivateKeyPath: /run/secrets/xnode-x25519.private
    PrivacyRouting__AllowInsecureHttpPeerTransport: "true"
    PrivacyRouting__MaximumConcurrentRequests: "64"
    PrivacyRouting__RequestsPerMinute: "600"
    PrivacyRouting__RequestTimeoutSeconds: "30"
    PrivacyRouting__ReplyPaddingBlockBytes: "4096"
    PrivacyRouting__ReplayCapacity: "100000"
    PrivacyRouting__ReplayTtlSeconds: "300"
    StorageRpc__BaseUrl: http://storage:8080
    RegistryHeartbeat__Enabled: "false"
    Vless__Enabled: "false"
    MembershipArtifact__ArtifactPath: /run/deep-membership/membership-route-catalog.json
    MembershipArtifact__MaximumBytes: "2097152"
    # The exact HTTP/2 privacy peer listener remains Docker-network-only on 8083. Generated route
    # authority selects the two mailbox-capable exits without public MAU2 access.
    Mailbox__Enabled: "true"
    Mailbox__DirectoryName: mailbox-p10c
    Mailbox__PeerReplayDirectoryName: mailbox-peer-replay-p10c
    Mailbox__PeerMutationDirectoryName: mailbox-peer-mutations-p10c
    Mailbox__ReplicationFactor: "2"
    Mailbox__WriteQuorum: "2"
    Mailbox__PeerTimeout: "00:00:15"
    Mailbox__AllowInsecureHttpPeerTransport: "true"
  healthcheck:
    <<: *health
    test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; case "$$status" in *" 200 "*) exit 0;; *) exit 1;; esac']

x-mailbox-driver-build: &mailbox-driver-build
  context: .
  pull: false
  additional_contexts:
    xnode_source: ${SURVIVAL_XNODE_BUILD_CONTEXT:-./artifacts/survival-dev/build-contexts/xnode}
  args:
    SDK_IMAGE: ${SURVIVAL_DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk@sha256:7e964ea8bc6c1e18ea9fbc76ed403da41c9b19aeee2aab6bf9c845f25e891380}
    RUNTIME_IMAGE: ${SURVIVAL_DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet@sha256:e3736b0d423db99c6988e1ddf5ea725c14b12579bb120024e5ff7ff204a14080}
    XNODE_REVISION: 00280a643cfdc1e0780147eceb1da5c7b6fd2799
    XNODE_SOURCE_CONTEXT_MANIFEST_SHA256: bd8cb5a16fb1d396716adc14d0adf95b005c0cccdf476cffd1cd65e5938aa102
  dockerfile_inline: |
    ARG SDK_IMAGE
    ARG RUNTIME_IMAGE
    FROM $${SDK_IMAGE} AS build
    ARG XNODE_SOURCE_CONTEXT_MANIFEST_SHA256
    WORKDIR /work
    COPY --from=xnode_source . /src
    COPY tools/survival-mailbox-driver ./driver
    RUN printf '%s  %s\n' "$${XNODE_SOURCE_CONTEXT_MANIFEST_SHA256}" /src/.survival-source-manifest.json | sha256sum -c -
    RUN dotnet publish driver/SurvivalMailboxDriver.csproj -c Release -o /out --runtime linux-arm64 --self-contained false -p:UseAppHost=false -p:XNodeSource=/src
    FROM $${RUNTIME_IMAGE}
    ARG XNODE_REVISION
    ARG XNODE_SOURCE_CONTEXT_MANIFEST_SHA256
    LABEL org.opencontainers.image.revision=$${XNODE_REVISION} \
          com.xpoint.source-context.manifest-sha256=$${XNODE_SOURCE_CONTEXT_MANIFEST_SHA256}
    WORKDIR /app
    COPY --from=build /out .
    USER 65532:65532
    ENTRYPOINT ["dotnet","SurvivalMailboxDriver.dll"]

x-membership-fixture-build: &membership-fixture-build
  context: .
  pull: false
  additional_contexts:
    membership_packages: ${SURVIVAL_MEMBERSHIP_PACKAGES_BUILD_CONTEXT:-./artifacts/survival-dev/build-contexts/membership-packages}
  args:
    SDK_IMAGE: ${SURVIVAL_DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk@sha256:7e964ea8bc6c1e18ea9fbc76ed403da41c9b19aeee2aab6bf9c845f25e891380}
    RUNTIME_IMAGE: ${SURVIVAL_DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet@sha256:e3736b0d423db99c6988e1ddf5ea725c14b12579bb120024e5ff7ff204a14080}
  dockerfile_inline: |
    ARG SDK_IMAGE
    ARG RUNTIME_IMAGE
    FROM $${SDK_IMAGE} AS build
    WORKDIR /src
    COPY tools/membership-fixture ./tools/membership-fixture
    COPY --from=membership_packages . ./tools/membership-fixture/packages
    RUN dotnet publish tools/membership-fixture/MembershipFixture.csproj -c Release -o /out --runtime linux-arm64 --self-contained false -p:UseAppHost=false
    FROM $${RUNTIME_IMAGE}
    WORKDIR /app
    COPY --from=build /out .
    USER 65532:65532
    ENTRYPOINT ["dotnet","MembershipFixture.dll"]

x-compat-build: &compat-build
  context: .
  pull: false
  args:
    NODE_IMAGE: ${SURVIVAL_NODE_IMAGE:-node@sha256:242549cd46785b480c832479a730f4f2a20865d61ea2e404fdb2a5c3d3b73ecf}
  dockerfile_inline: |
    ARG NODE_IMAGE
    FROM $${NODE_IMAGE}
    WORKDIR /service
    COPY --chown=node:node tools/compat-services ./tools/compat-services
    COPY --chown=node:node tools/storage-service ./tools/storage-service
    COPY --chown=node:node tools/file-service ./tools/file-service
    COPY --chown=node:node tools/push-service ./tools/push-service
    RUN mkdir /state && chown node:node /state
    USER node

services:
  mailbox-driver-state-init:
    profiles: [mailbox-rehearsal]
    image: ${SURVIVAL_DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet@sha256:e3736b0d423db99c6988e1ddf5ea725c14b12579bb120024e5ff7ff204a14080}
    user: "0:0"
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    network_mode: none
    read_only: true
    volumes: [mailbox-rehearsal-state:/state]
    command: [sh, -ec, "mkdir -p /state/driver && chown 65532:65532 /state /state/driver"]

  mailbox-driver:
    <<: *service
    profiles: [mailbox-rehearsal]
    restart: "no"
    image: deep-survival/mailbox-driver:dev
    build: *mailbox-driver-build
    volumes:
      - mailbox-rehearsal-state:/state
      - ${SURVIVAL_MAILBOX_PUBLIC_AUTHORITY:-./artifacts/survival-dev/mailbox-peer-authority.public.json}:/run/survival/mailbox-peer-authority.public.json:ro
    secrets:
      - { source: xnode-1-ed25519, target: xnode-1-ed25519.seed }
      - { source: mailbox-client-issuer, target: mailbox-client-issuer.seed }
    depends_on:
      mailbox-driver-state-init: { condition: service_completed_successfully }
    command: [reset]

  membership-artifact-owner-init:
    image: ${SURVIVAL_NODE_IMAGE:-node@sha256:242549cd46785b480c832479a730f4f2a20865d61ea2e404fdb2a5c3d3b73ecf}
    user: "0:0"
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    network_mode: none
    read_only: true
    volumes:
      - membership-route-artifact:/out
      - ./tools/membership-artifact-init:/opt/deep-membership-init:ro
    command: [node, /opt/deep-membership-init/membership-artifact-init.mjs, owner]

  membership-artifact-init:
    image: ${SURVIVAL_NODE_IMAGE:-node@sha256:242549cd46785b480c832479a730f4f2a20865d61ea2e404fdb2a5c3d3b73ecf}
    user: "65532:65532"
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    read_only: true
    volumes:
      - membership-route-artifact:/out
      - ./tools/membership-artifact-init:/opt/deep-membership-init:ro
    depends_on:
      membership-artifact-owner-init: { condition: service_completed_successfully }
    command: [node, /opt/deep-membership-init/membership-artifact-init.mjs, clear]

  membership-fixture:
    platform: linux/arm64
    init: true
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    image: deep-survival/membership-fixture:dev
    build: *membership-fixture-build
    volumes: [membership-route-artifact:/out]
    depends_on:
      membership-artifact-init: { condition: service_completed_successfully }
    command: [--advertised-host, "${SURVIVAL_BIND_HOST:-127.0.0.1}"]

  contracts-deployments-init:
    profiles: [chain]
    image: ${SURVIVAL_NODE_IMAGE:-node@sha256:242549cd46785b480c832479a730f4f2a20865d61ea2e404fdb2a5c3d3b73ecf}
    user: "0:0"
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    network_mode: none
    read_only: true
    volumes:
      - contracts-deployments:/workspace/deployments
    command:
      - sh
      - -ec
      - chown -R 1000:1000 /workspace/deployments

  contracts-devnet:
    <<: *service
    profiles: [chain]
    restart: "no"
    image: deep-survival/contracts-devnet:dev
    build:
      context: .
      pull: false
      additional_contexts:
        contracts_source: ${SURVIVAL_CONTRACTS_BUILD_CONTEXT:-./artifacts/survival-dev/build-contexts/contracts}
      args:
        NODE_IMAGE: ${SURVIVAL_NODE_IMAGE:-node@sha256:242549cd46785b480c832479a730f4f2a20865d61ea2e404fdb2a5c3d3b73ecf}
      dockerfile_inline: |
        ARG NODE_IMAGE
        FROM $${NODE_IMAGE}
        WORKDIR /workspace
        COPY scripts/package-json-normalizer.mjs /survival/
        COPY --from=contracts_source package.json pnpm-lock.yaml ./
        RUN node /survival/package-json-normalizer.mjs package.json && mkdir -p /opt/corepack && COREPACK_HOME=/opt/corepack corepack prepare pnpm@9.1.3 --activate && corepack enable && COREPACK_HOME=/opt/corepack pnpm install --frozen-lockfile
        COPY --from=contracts_source . .
        RUN node /survival/package-json-normalizer.mjs package.json && COREPACK_HOME=/opt/corepack pnpm exec hardhat compile && cp -a /workspace/cache /opt/hardhat-cache && chown -R node:node /workspace /opt/corepack /opt/hardhat-cache
        COPY --chmod=0555 scripts/survival-hardhat-entrypoint.sh /usr/local/bin/survival-hardhat-entrypoint
        ENV COREPACK_HOME=/opt/corepack
        ENV COREPACK_ENABLE_NETWORK=0
        USER node
        ENTRYPOINT ["/usr/local/bin/survival-hardhat-entrypoint"]
    command: [pnpm, exec, hardhat, node, --hostname, 0.0.0.0]
    environment:
      CI: "true"
      HARDHAT_DISABLE_TELEMETRY: "true"
      HOME: /tmp
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /workspace/cache:rw,noexec,nosuid,nodev,size=64m,mode=1777
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41545:8545"]
    volumes:
      - contracts-deployments:/workspace/deployments
    depends_on:
      contracts-deployments-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *health
      test: [CMD, node, --eval, "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>r.json()).then(v=>process.exit(v.result==='0x7a69'?0:1)).catch(()=>process.exit(1))"]

  contracts-deploy:
    platform: linux/arm64
    init: true
    profiles: [chain]
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:contracts-devnet
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /workspace/cache:rw,noexec,nosuid,nodev,size=64m,mode=1777
    labels:
      com.xpoint.survival.stack: dev
    image: deep-survival/contracts-devnet:dev
    environment:
      CI: "true"
      HARDHAT_DISABLE_TELEMETRY: "true"
      HOME: /tmp
    volumes:
      - contracts-deployments:/workspace/deployments
    depends_on:
      contracts-deployments-init: { condition: service_completed_successfully }
      contracts-devnet: { condition: service_healthy }
    command: [sh, -ec, "rm -f /workspace/deployments/localhost.latest.json && pnpm exec hardhat run --no-compile scripts/deploy-local-devnet.js --network localhost && chmod 0644 /workspace/deployments/localhost.latest.json"]

  contracts-smoke:
    platform: linux/arm64
    init: true
    profiles: [chain]
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:contracts-devnet
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /workspace/cache:rw,noexec,nosuid,nodev,size=64m,mode=1777
    labels:
      com.xpoint.survival.stack: dev
    image: deep-survival/contracts-devnet:dev
    environment:
      CI: "true"
      HARDHAT_DISABLE_TELEMETRY: "true"
      HOME: /tmp
    volumes:
      - contracts-deployments:/workspace/deployments:ro
    depends_on:
      contracts-deploy: { condition: service_completed_successfully }
    command: [pnpm, exec, hardhat, run, --no-compile, scripts/local-devnet-smoke.js, --network, localhost]

  xnode-1:
    <<: *xnode
    build: *xnode-build
    env_file:
      - ${SURVIVAL_MAILBOX_AUTHORITY_ENV:-./artifacts/survival-dev/mailbox-peer-authority.env}
      - ${SURVIVAL_MAILBOX_CLIENT_AUTHORITY_ENV:-./artifacts/survival-dev/mailbox-client-xnode-1.env}
      - ./artifacts/survival-dev/privacy-routing-xnode-1.env
    environment:
      <<: *xnode-environment
      Node__PublicHost: ${SURVIVAL_BIND_HOST:-127.0.0.1}
      Node__PublicPort: "41801"
      Node__RouterId: 4cb5abf6ad79fbf5abbccafcc269d85cd2651ed4b885b5869f241aedf0a5ba29
      Node__Ed25519PrivateKeyPath: /run/secrets/xnode-ed25519.seed
      PrivacyRouting__PublicPeerBaseUrl: http://172.30.82.11:8083/
      MailboxAuthorityForwarding__AllowedExitRouterIds__0: 7422b9887598068e32c4448a949adb290d0f4e35b9e01b0ee5f1a1e600fe2674
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41801:8080"]
    networks: { runtime: { ipv4_address: 172.30.82.11 } }
    volumes: [xnode-1-state:/state, membership-route-artifact:/run/deep-membership:ro]
    secrets:
      - source: xnode-1-ed25519
        target: xnode-ed25519.seed
      - source: xnode-1-x25519
        target: xnode-x25519.private
    depends_on:
      membership-fixture: { condition: service_completed_successfully }

  xnode-2:
    <<: *xnode
    env_file:
      - ${SURVIVAL_MAILBOX_AUTHORITY_ENV:-./artifacts/survival-dev/mailbox-peer-authority.env}
      - ./artifacts/survival-dev/privacy-routing-xnode-2.env
    environment:
      <<: *xnode-environment
      Node__PublicHost: xnode-2
      Node__PublicPort: "41802"
      Node__RouterId: 7422b9887598068e32c4448a949adb290d0f4e35b9e01b0ee5f1a1e600fe2674
      Node__Ed25519PrivateKeyPath: /run/secrets/xnode-ed25519.seed
      PrivacyRouting__PublicPeerBaseUrl: http://172.30.82.12:8083/
      MailboxAuthorityForwarding__Enabled: "true"
      MailboxAuthorityForwarding__AuthorityRouterId: 4cb5abf6ad79fbf5abbccafcc269d85cd2651ed4b885b5869f241aedf0a5ba29
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41802:8080"]
    networks: { runtime: { ipv4_address: 172.30.82.12 } }
    volumes: [xnode-2-state:/state, membership-route-artifact:/run/deep-membership:ro]
    secrets:
      - source: xnode-2-ed25519
        target: xnode-ed25519.seed
      - source: xnode-2-x25519
        target: xnode-x25519.private
    depends_on:
      membership-fixture: { condition: service_completed_successfully }

  xnode-3:
    <<: *xnode
    env_file:
      - ${SURVIVAL_MAILBOX_AUTHORITY_ENV:-./artifacts/survival-dev/mailbox-peer-authority.env}
      - ./artifacts/survival-dev/privacy-routing-xnode-3.env
    environment:
      <<: *xnode-environment
      Node__PublicHost: xnode-3
      Node__RouterId: f381626e41e7027ea431bfe3009e94bdd25a746beec468948d6c3c7c5dc9a54b
      Node__Ed25519PrivateKeyPath: /run/secrets/xnode-ed25519.seed
      PrivacyRouting__PublicPeerBaseUrl: http://172.30.82.13:8083/
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41803:8080"]
    networks: { runtime: { ipv4_address: 172.30.82.13 } }
    volumes: [xnode-3-state:/state, membership-route-artifact:/run/deep-membership:ro]
    secrets:
      - source: xnode-3-ed25519
        target: xnode-ed25519.seed
      - source: xnode-3-x25519
        target: xnode-x25519.private
    depends_on:
      membership-fixture: { condition: service_completed_successfully }

  xnode-4:
    <<: *xnode
    env_file:
      - ${SURVIVAL_MAILBOX_AUTHORITY_ENV:-./artifacts/survival-dev/mailbox-peer-authority.env}
      - ./artifacts/survival-dev/privacy-routing-xnode-4.env
    environment:
      <<: *xnode-environment
      Node__PublicHost: xnode-4
      Node__RouterId: fd50b8e3b144ea244fbf7737f550bc8dd0c2650bbc1aada833ca17ff8dbf329b
      Node__Ed25519PrivateKeyPath: /run/secrets/xnode-ed25519.seed
      PrivacyRouting__PublicPeerBaseUrl: http://172.30.82.14:8083/
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41804:8080"]
    networks: { runtime: { ipv4_address: 172.30.82.14 } }
    volumes: [xnode-4-state:/state, membership-route-artifact:/run/deep-membership:ro]
    secrets:
      - source: xnode-4-ed25519
        target: xnode-ed25519.seed
      - source: xnode-4-x25519
        target: xnode-x25519.private
    depends_on:
      membership-fixture: { condition: service_completed_successfully }

  xnode-5:
    <<: *xnode
    env_file:
      - ${SURVIVAL_MAILBOX_AUTHORITY_ENV:-./artifacts/survival-dev/mailbox-peer-authority.env}
      - ./artifacts/survival-dev/privacy-routing-xnode-5.env
    environment:
      <<: *xnode-environment
      Node__PublicHost: xnode-5
      Node__RouterId: fde4fba030ad002f7c2f7d4c331f49d13fb0ec747eceebec634f1ff4cbca9def
      Node__Ed25519PrivateKeyPath: /run/secrets/xnode-ed25519.seed
      PrivacyRouting__PublicPeerBaseUrl: http://172.30.82.15:8083/
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41805:8080"]
    networks: { runtime: { ipv4_address: 172.30.82.15 } }
    volumes: [xnode-5-state:/state, membership-route-artifact:/run/deep-membership:ro]
    secrets:
      - source: xnode-5-ed25519
        target: xnode-ed25519.seed
      - source: xnode-5-x25519
        target: xnode-x25519.private
    depends_on:
      membership-fixture: { condition: service_completed_successfully }

  xnode-6:
    <<: *xnode
    env_file:
      - ${SURVIVAL_MAILBOX_AUTHORITY_ENV:-./artifacts/survival-dev/mailbox-peer-authority.env}
      - ./artifacts/survival-dev/privacy-routing-xnode-6.env
    environment:
      <<: *xnode-environment
      Node__PublicHost: xnode-6
      Node__RouterId: b4c92afb3ba57f3ab959ffe6d319c98484a2155a0f4c65b2c37011ffd197b075
      Node__Ed25519PrivateKeyPath: /run/secrets/xnode-ed25519.seed
      PrivacyRouting__PublicPeerBaseUrl: http://172.30.82.16:8083/
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41806:8080"]
    networks: { runtime: { ipv4_address: 172.30.82.16 } }
    volumes: [xnode-6-state:/state, membership-route-artifact:/run/deep-membership:ro]
    secrets:
      - source: xnode-6-ed25519
        target: xnode-ed25519.seed
      - source: xnode-6-x25519
        target: xnode-x25519.private
    depends_on:
      membership-fixture: { condition: service_completed_successfully }

  registry:
    <<: *service
    image: deep-survival/registry:dev
    build:
      context: .
      pull: false
      additional_contexts:
        registry_source: ${SURVIVAL_REGISTRY_BUILD_CONTEXT:-./artifacts/survival-dev/build-contexts/registry}
      args:
        SDK_IMAGE: ${SURVIVAL_DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk@sha256:7e964ea8bc6c1e18ea9fbc76ed403da41c9b19aeee2aab6bf9c845f25e891380}
        RUNTIME_IMAGE: ${SURVIVAL_DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet@sha256:e3736b0d423db99c6988e1ddf5ea725c14b12579bb120024e5ff7ff204a14080}
      dockerfile_inline: |
        ARG SDK_IMAGE
        ARG RUNTIME_IMAGE
        FROM $${SDK_IMAGE} AS build
        WORKDIR /src
        COPY --from=registry_source . .
        RUN dotnet publish src/Deep.Registry.Api/Deep.Registry.Api.csproj -c Debug -o /out --runtime linux-arm64 --self-contained false -p:UseAppHost=false
        FROM $${RUNTIME_IMAGE}
        WORKDIR /app
        COPY --from=build /out .
        RUN mkdir /state && chown 65532:65532 /state
        USER 65532:65532
        ENTRYPOINT ["dotnet","Deep.Registry.Api.dll"]
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Registry__StatePath: /state/registry.json
      Registry__StakingBackendBaseUrl: http://staking-backend:8080
      Registry__MembershipRouteArtifactPath: /run/deep-membership/membership-route-catalog.json
      Registry__MembershipRouteArtifactMaximumBytes: "2097152"
      Calls__Required: "true"
      Calls__Enabled: "true"
      Calls__StatePath: /state/calls-v2.json
      Calls__TurnSharedSecretFile: /run/secrets/turn-shared-secret
      Calls__CredentialLifetimeSeconds: "3600"
      Calls__IceUrls__0: stun:${SURVIVAL_BIND_HOST:-127.0.0.1}:3478
      Calls__IceUrls__1: turn:${SURVIVAL_BIND_HOST:-127.0.0.1}:3478?transport=udp
      Calls__IceUrls__2: turn:${SURVIVAL_BIND_HOST:-127.0.0.1}:3478?transport=tcp
      Calls__IceUrls__3: turns:${SURVIVAL_BIND_HOST:-127.0.0.1}:5349?transport=tcp
    ports:
      - "${SURVIVAL_BIND_HOST:-127.0.0.1}:41810:8080"
      - "${SURVIVAL_BIND_HOST:-127.0.0.1}:41823:8080"
    volumes: [registry-state:/state, membership-route-artifact:/run/deep-membership:ro]
    secrets:
      - source: turn-shared-secret
        target: turn-shared-secret
    depends_on:
      membership-fixture: { condition: service_completed_successfully }
    healthcheck: { <<: *health, test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; case "$$status" in *" 200 "*) exit 0;; *) exit 1;; esac'] }

  staking-backend:
    <<: *service
    profiles: [chain]
    image: deep-survival/staking-backend:dev
    build:
      context: .
      pull: false
      additional_contexts:
        staking_source: ${SURVIVAL_STAKING_BUILD_CONTEXT:-./artifacts/survival-dev/build-contexts/staking}
      args:
        SDK_IMAGE: ${SURVIVAL_DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk@sha256:7e964ea8bc6c1e18ea9fbc76ed403da41c9b19aeee2aab6bf9c845f25e891380}
        RUNTIME_IMAGE: ${SURVIVAL_DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet@sha256:e3736b0d423db99c6988e1ddf5ea725c14b12579bb120024e5ff7ff204a14080}
      dockerfile_inline: |
        ARG SDK_IMAGE
        ARG RUNTIME_IMAGE
        FROM $${SDK_IMAGE} AS build
        WORKDIR /src
        COPY --from=staking_source . .
        RUN dotnet publish src/XPoint.Staking.Backend/XPoint.Staking.Backend.csproj -c Debug -o /out --runtime linux-arm64 --self-contained false -p:UseAppHost=false
        FROM $${RUNTIME_IMAGE}
        WORKDIR /app
        COPY --from=build /out .
        RUN mkdir /state && chown 65532:65532 /state
        USER 65532:65532
        ENTRYPOINT ["dotnet","XPoint.Staking.Backend.dll"]
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Contracts__ChainId: "31337"
      Contracts__EthereumRpcUrl: http://contracts-devnet:8545
      Contracts__DeploymentManifestPath: /run/deep-contracts/localhost.latest.json
      Contracts__ExpectedDeploymentNetwork: localhost
      Contracts__ExpectedDeploymentChainId: "31337"
      Contracts__StatePath: /state/staking.json
      Registry__BaseUrl: http://registry:8080
      Price__EthereumRpcUrl: ""
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41811:8080"]
    volumes:
      - staking-state:/state
      - contracts-deployments:/run/deep-contracts:ro
    depends_on:
      contracts-smoke: { condition: service_completed_successfully }
    healthcheck:
      <<: *health
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; case "$$status" in *" 200 "*) exit 0;; *) exit 1;; esac']

  storage:
    <<: *service
    image: deep-survival/compat:dev
    build: *compat-build
    command: [node, tools/storage-service/storage-service.mjs]
    environment: { PORT: "8080", SERVICE_NAME: survival-storage, COMPAT_STATE_DIR: /state, PUSH_COMPAT_NOTIFY_URL: http://push:8080 }
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41820:8080"]
    volumes: [storage-state:/state]
    healthcheck: { <<: *health, test: [CMD, node, --eval, "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  file:
    <<: *service
    image: deep-survival/compat:dev
    command: [node, tools/file-service/file-service.mjs]
    environment: { PORT: "8080", SERVICE_NAME: survival-file, COMPAT_STATE_DIR: /state }
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41821:8080"]
    volumes: [file-state:/state]
    healthcheck: { <<: *health, test: [CMD, node, --eval, "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  push:
    <<: *service
    image: deep-survival/compat:dev
    command: [node, tools/push-service/push-service.mjs]
    environment: { PORT: "8080", SERVICE_NAME: survival-push, COMPAT_STATE_DIR: /state }
    ports: ["${SURVIVAL_BIND_HOST:-127.0.0.1}:41822:8080"]
    volumes: [push-state:/state]
    healthcheck: { <<: *health, test: [CMD, node, --eval, "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

