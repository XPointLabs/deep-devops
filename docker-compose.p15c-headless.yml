name: ${P15C_PROJECT_NAME:?P15C_PROJECT_NAME is required}

x-service: &service
  platform: linux/arm64
  pull_policy: never
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [runtime]
  restart: "no"
  tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=32m]

x-health: &health
  interval: 3s
  timeout: 2s
  retries: 40
  start_period: 5s

x-state-tmpfs: &state-tmpfs
  - /tmp:rw,noexec,nosuid,nodev,size=32m
  - /state:rw,noexec,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=0700

x-node-state-tmpfs: &node-state-tmpfs
  - /tmp:rw,noexec,nosuid,nodev,size=32m
  - /state:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700

x-labels: &labels
  org.opencontainers.image.revision: ${P15C_DEVOPS_SHA:?P15C_DEVOPS_SHA is required}
  org.opencontainers.image.source-tree: ${P15C_DEVOPS_TREE:?P15C_DEVOPS_TREE is required}
  com.xpoint.evidence-class: headless-harness
  com.xpoint.product-runtime: "false"
  com.xpoint.p15c.ownership-nonce: ${P15C_OWNERSHIP_NONCE:?P15C_OWNERSHIP_NONCE is required}

x-xnode: &xnode
  <<: *service
  image: ${P15C_XNODE_IMAGE_NAME:?P15C_XNODE_IMAGE_NAME is required}
  build:
    context: ${P15C_DEVOPS_CONTEXT:?P15C_DEVOPS_CONTEXT is required}
    pull: false
    additional_contexts:
      xnode_source: ${P15C_XNODE_CONTEXT:?P15C_XNODE_CONTEXT is required}
    args:
      SDK_IMAGE: ${P15C_DOTNET_SDK_IMAGE:?P15C_DOTNET_SDK_IMAGE is required}
      RUNTIME_IMAGE: ${P15C_DOTNET_RUNTIME_IMAGE:?P15C_DOTNET_RUNTIME_IMAGE is required}
      SOURCE_SHA: ${P15C_XNODE_SHA:?P15C_XNODE_SHA is required}
      SOURCE_TREE: ${P15C_XNODE_TREE:?P15C_XNODE_TREE is required}
      OWNERSHIP_NONCE: ${P15C_OWNERSHIP_NONCE}
    labels:
      org.opencontainers.image.revision: ${P15C_XNODE_SHA}
      org.opencontainers.image.source-tree: ${P15C_XNODE_TREE}
      org.opencontainers.image.source: xnode
      com.xpoint.p15c.role: xnode
      com.xpoint.evidence-class: headless-harness
      com.xpoint.product-runtime: "false"
      com.xpoint.p15c.ownership-nonce: ${P15C_OWNERSHIP_NONCE}
    dockerfile_inline: |
      ARG SDK_IMAGE
      ARG RUNTIME_IMAGE
      FROM $${SDK_IMAGE} AS build
      WORKDIR /src
      COPY --from=xnode_source . .
      RUN test "$$(dotnet --version)" = "10.0.301" && dotnet publish src/XNode/XNode.csproj -c Release -o /out --runtime linux-arm64 --self-contained false -p:UseAppHost=false
      FROM $${RUNTIME_IMAGE}
      ARG SOURCE_SHA SOURCE_TREE OWNERSHIP_NONCE
      LABEL org.opencontainers.image.revision="$${SOURCE_SHA}" org.opencontainers.image.source-tree="$${SOURCE_TREE}" org.opencontainers.image.source="xnode" com.xpoint.p15c.role="xnode" com.xpoint.evidence-class="headless-harness" com.xpoint.product-runtime="false" com.xpoint.p15c.ownership-nonce="$${OWNERSHIP_NONCE}"
      WORKDIR /app
      COPY --from=build /out .
      RUN mkdir /state && chown 65532:65532 /state
      USER 65532:65532
      ENTRYPOINT ["dotnet","XNode.dll"]
  environment:
    ASPNETCORE_ENVIRONMENT: P15C
    Node__Ed25519PrivateKeyPath: /run/secrets/node-seed
    Node__DataDirectory: /state
    Node__ApiListenUrl: http://0.0.0.0:8080
    Node__PeerRpcListenUrl: http://0.0.0.0:8081
    Node__Network: p15c-local
    Node__PublicHost: xnode
    Node__PublicPort: "8080"
    Node__PublicPeerRpcPort: "8081"
    Runtime__BootstrapFromStorage: "false"
    Runtime__AllowLoopbackPeerEndpoints: "true"
    StorageRpc__BaseUrl: http://storage:8080
    RegistryHeartbeat__Enabled: "false"
    Vless__Enabled: "false"
  healthcheck:
    <<: *health
    test: [CMD-SHELL, "test -r /proc/1/status"]

x-compat-build: &compat-build
  context: ${P15C_DEVOPS_CONTEXT:?P15C_DEVOPS_CONTEXT is required}
  pull: false
  args:
    NODE_IMAGE: ${P15C_NODE_IMAGE:?P15C_NODE_IMAGE is required}
    SOURCE_SHA: ${P15C_DEVOPS_SHA}
    SOURCE_TREE: ${P15C_DEVOPS_TREE}
    OWNERSHIP_NONCE: ${P15C_OWNERSHIP_NONCE}
  dockerfile_inline: |
    ARG NODE_IMAGE
    FROM $${NODE_IMAGE}
    ARG SOURCE_SHA SOURCE_TREE OWNERSHIP_NONCE ROLE
    LABEL org.opencontainers.image.revision="$${SOURCE_SHA}" org.opencontainers.image.source-tree="$${SOURCE_TREE}" org.opencontainers.image.source="deep-devops" com.xpoint.p15c.role="$${ROLE}" com.xpoint.evidence-class="headless-harness" com.xpoint.product-runtime="false" com.xpoint.p15c.ownership-nonce="$${OWNERSHIP_NONCE}"
    WORKDIR /service
    COPY --chown=node:node tools/compat-services ./tools/compat-services
    COPY --chown=node:node tools/storage-service ./tools/storage-service
    COPY --chown=node:node tools/file-service ./tools/file-service
    COPY --chown=node:node tools/push-service ./tools/push-service
    COPY --chown=node:node tools/calls-service ./tools/calls-service
    RUN mkdir /state && chown node:node /state
    USER node

services:
  contracts-devnet:
    <<: *service
    image: ${P15C_CONTRACTS_IMAGE_NAME:?P15C_CONTRACTS_IMAGE_NAME is required}
    build:
      context: ${P15C_DEVOPS_CONTEXT:?P15C_DEVOPS_CONTEXT is required}
      pull: false
      additional_contexts:
        contracts_source: ${P15C_CONTRACTS_CONTEXT:?P15C_CONTRACTS_CONTEXT is required}
      args:
        NODE_IMAGE: ${P15C_NODE_IMAGE}
        SOURCE_SHA: ${P15C_CONTRACTS_SHA:?P15C_CONTRACTS_SHA is required}
        SOURCE_TREE: ${P15C_CONTRACTS_TREE:?P15C_CONTRACTS_TREE is required}
        OWNERSHIP_NONCE: ${P15C_OWNERSHIP_NONCE}
      labels:
        org.opencontainers.image.revision: ${P15C_CONTRACTS_SHA}
        org.opencontainers.image.source-tree: ${P15C_CONTRACTS_TREE}
        org.opencontainers.image.source: xpoint-staking-contracts
        com.xpoint.p15c.role: contracts-devnet
        com.xpoint.evidence-class: headless-harness
        com.xpoint.product-runtime: "false"
        com.xpoint.p15c.ownership-nonce: ${P15C_OWNERSHIP_NONCE}
      dockerfile_inline: |
        ARG NODE_IMAGE
        FROM $${NODE_IMAGE}
        ARG SOURCE_SHA SOURCE_TREE OWNERSHIP_NONCE
        LABEL org.opencontainers.image.revision="$${SOURCE_SHA}" org.opencontainers.image.source-tree="$${SOURCE_TREE}" org.opencontainers.image.source="xpoint-staking-contracts" com.xpoint.p15c.role="contracts-devnet" com.xpoint.evidence-class="headless-harness" com.xpoint.product-runtime="false" com.xpoint.p15c.ownership-nonce="$${OWNERSHIP_NONCE}"
        WORKDIR /workspace
        COPY --from=contracts_source . .
        RUN corepack enable && pnpm install --frozen-lockfile && pnpm exec hardhat compile
        USER node
    command: [pnpm, exec, hardhat, node, --hostname, 0.0.0.0]
    environment: { CI: "true", HARDHAT_DISABLE_TELEMETRY: "true", HOME: /tmp }
    ports: ["127.0.0.1:${P15C_CONTRACTS_PORT:?P15C_CONTRACTS_PORT is required}:8545"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /workspace/deployments:rw,noexec,nosuid,nodev,size=8m,uid=1000,gid=1000
    labels:
      <<: *labels
      com.xpoint.p15c.role: contracts-devnet
    healthcheck:
      <<: *health
      test: [CMD, node, --eval, "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>r.json()).then(v=>process.exit(v.result==='0x7a69'?0:1)).catch(()=>process.exit(1))"]

  xnode-1:
    <<: *xnode
    ports: ["127.0.0.1:${P15C_XNODE1_PORT:?P15C_XNODE1_PORT is required}:8080"]
    tmpfs: *state-tmpfs
    secrets:
      - { source: xnode-1-identity, target: node-seed, uid: "65532", gid: "65532", mode: 0400 }
      - { source: xnode-1-config, target: /app/appsettings.P15C.json, uid: "65532", gid: "65532", mode: 0400 }
    labels: { <<: *labels, com.xpoint.p15c.role: xnode-1 }

  xnode-2:
    <<: *xnode
    ports: ["127.0.0.1:${P15C_XNODE2_PORT:?P15C_XNODE2_PORT is required}:8080"]
    tmpfs: *state-tmpfs
    secrets:
      - { source: xnode-2-identity, target: node-seed, uid: "65532", gid: "65532", mode: 0400 }
      - { source: xnode-2-config, target: /app/appsettings.P15C.json, uid: "65532", gid: "65532", mode: 0400 }
    labels: { <<: *labels, com.xpoint.p15c.role: xnode-2 }

  xnode-3:
    <<: *xnode
    ports: ["127.0.0.1:${P15C_XNODE3_PORT:?P15C_XNODE3_PORT is required}:8080"]
    tmpfs: *state-tmpfs
    secrets:
      - { source: xnode-3-identity, target: node-seed, uid: "65532", gid: "65532", mode: 0400 }
      - { source: xnode-3-config, target: /app/appsettings.P15C.json, uid: "65532", gid: "65532", mode: 0400 }
    labels: { <<: *labels, com.xpoint.p15c.role: xnode-3 }

  registry:
    <<: *service
    image: ${P15C_REGISTRY_IMAGE_NAME:?P15C_REGISTRY_IMAGE_NAME is required}
    build:
      context: ${P15C_DEVOPS_CONTEXT:?P15C_DEVOPS_CONTEXT is required}
      pull: false
      additional_contexts: { registry_source: "${P15C_REGISTRY_CONTEXT:?P15C_REGISTRY_CONTEXT is required}" }
      args: { SDK_IMAGE: "${P15C_DOTNET_SDK_IMAGE}", RUNTIME_IMAGE: "${P15C_DOTNET_RUNTIME_IMAGE}", SOURCE_SHA: "${P15C_REGISTRY_SHA:?P15C_REGISTRY_SHA is required}", SOURCE_TREE: "${P15C_REGISTRY_TREE:?P15C_REGISTRY_TREE is required}", OWNERSHIP_NONCE: "${P15C_OWNERSHIP_NONCE}" }
      labels: { org.opencontainers.image.revision: "${P15C_REGISTRY_SHA}", org.opencontainers.image.source-tree: "${P15C_REGISTRY_TREE}", org.opencontainers.image.source: deep-registry-api, com.xpoint.p15c.role: registry, com.xpoint.evidence-class: headless-harness, com.xpoint.product-runtime: "false", com.xpoint.p15c.ownership-nonce: "${P15C_OWNERSHIP_NONCE}" }
      dockerfile_inline: |
        ARG SDK_IMAGE
        ARG RUNTIME_IMAGE
        FROM $${SDK_IMAGE} AS build
        WORKDIR /src
        COPY --from=registry_source . .
        RUN dotnet publish src/Deep.Registry.Api/Deep.Registry.Api.csproj -c Release -o /out --runtime linux-arm64 --self-contained false -p:UseAppHost=false
        FROM $${RUNTIME_IMAGE}
        ARG SOURCE_SHA SOURCE_TREE OWNERSHIP_NONCE
        LABEL org.opencontainers.image.revision="$${SOURCE_SHA}" org.opencontainers.image.source-tree="$${SOURCE_TREE}" org.opencontainers.image.source="deep-registry-api" com.xpoint.p15c.role="registry" com.xpoint.evidence-class="headless-harness" com.xpoint.product-runtime="false" com.xpoint.p15c.ownership-nonce="$${OWNERSHIP_NONCE}"
        WORKDIR /app
        COPY --from=build /out .
        RUN mkdir /state && chown 65532:65532 /state
        USER 65532:65532
        ENTRYPOINT ["dotnet","Deep.Registry.Api.dll"]
    environment: { ASPNETCORE_URLS: http://0.0.0.0:8080, Registry__StatePath: /state/registry.json, Registry__StakingBackendBaseUrl: http://staking-backend:8080 }
    ports: ["127.0.0.1:${P15C_REGISTRY_PORT:?P15C_REGISTRY_PORT is required}:8080"]
    tmpfs: *state-tmpfs
    labels: { <<: *labels, com.xpoint.p15c.role: registry }
    healthcheck: { <<: *health, test: [CMD-SHELL, "test -r /proc/1/status"] }

  staking-backend:
    <<: *service
    image: ${P15C_STAKING_IMAGE_NAME:?P15C_STAKING_IMAGE_NAME is required}
    build:
      context: ${P15C_DEVOPS_CONTEXT:?P15C_DEVOPS_CONTEXT is required}
      pull: false
      additional_contexts: { staking_source: "${P15C_STAKING_CONTEXT:?P15C_STAKING_CONTEXT is required}" }
      args: { SDK_IMAGE: "${P15C_DOTNET_SDK_IMAGE}", RUNTIME_IMAGE: "${P15C_DOTNET_RUNTIME_IMAGE}", SOURCE_SHA: "${P15C_STAKING_SHA:?P15C_STAKING_SHA is required}", SOURCE_TREE: "${P15C_STAKING_TREE:?P15C_STAKING_TREE is required}", OWNERSHIP_NONCE: "${P15C_OWNERSHIP_NONCE}" }
      labels: { org.opencontainers.image.revision: "${P15C_STAKING_SHA}", org.opencontainers.image.source-tree: "${P15C_STAKING_TREE}", org.opencontainers.image.source: xpoint-staking-backend, com.xpoint.p15c.role: staking-backend, com.xpoint.evidence-class: headless-harness, com.xpoint.product-runtime: "false", com.xpoint.p15c.ownership-nonce: "${P15C_OWNERSHIP_NONCE}" }
      dockerfile_inline: |
        ARG SDK_IMAGE
        ARG RUNTIME_IMAGE
        FROM $${SDK_IMAGE} AS build
        WORKDIR /src
        COPY --from=staking_source . .
        RUN dotnet publish src/XPoint.Staking.Backend/XPoint.Staking.Backend.csproj -c Release -o /out --runtime linux-arm64 --self-contained false -p:UseAppHost=false
        FROM $${RUNTIME_IMAGE}
        ARG SOURCE_SHA SOURCE_TREE OWNERSHIP_NONCE
        LABEL org.opencontainers.image.revision="$${SOURCE_SHA}" org.opencontainers.image.source-tree="$${SOURCE_TREE}" org.opencontainers.image.source="xpoint-staking-backend" com.xpoint.p15c.role="staking-backend" com.xpoint.evidence-class="headless-harness" com.xpoint.product-runtime="false" com.xpoint.p15c.ownership-nonce="$${OWNERSHIP_NONCE}"
        WORKDIR /app
        COPY --from=build /out .
        RUN mkdir /state && chown 65532:65532 /state
        USER 65532:65532
        ENTRYPOINT ["dotnet","XPoint.Staking.Backend.dll"]
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Contracts__ChainId: "31337"
      Contracts__EthereumRpcUrl: http://contracts-devnet:8545
      Contracts__TokenAddress: ${P15C_TOKEN_ADDRESS:-}
      Contracts__ServiceNodeRewardsAddress: ${P15C_REWARDS_ADDRESS:-}
      Contracts__ServiceNodeContributionFactoryAddress: ${P15C_FACTORY_ADDRESS:-}
      Contracts__RewardRatePoolAddress: ${P15C_POOL_ADDRESS:-}
      Contracts__StatePath: /state/staking.json
      Registry__BaseUrl: http://registry:8080
      Price__EthereumRpcUrl: ""
    ports: ["127.0.0.1:${P15C_STAKING_PORT:?P15C_STAKING_PORT is required}:8080"]
    tmpfs: *state-tmpfs
    labels: { <<: *labels, com.xpoint.p15c.role: staking-backend }
    healthcheck: { <<: *health, test: [CMD-SHELL, "test -r /proc/1/status"] }

  storage:
    <<: *service
    image: ${P15C_STORAGE_IMAGE_NAME:?P15C_STORAGE_IMAGE_NAME is required}
    build: { <<: *compat-build, args: { NODE_IMAGE: "${P15C_NODE_IMAGE}", SOURCE_SHA: "${P15C_DEVOPS_SHA}", SOURCE_TREE: "${P15C_DEVOPS_TREE}", OWNERSHIP_NONCE: "${P15C_OWNERSHIP_NONCE}", ROLE: storage } }
    command: [node, tools/storage-service/storage-service.mjs]
    environment: { PORT: "8080", SERVICE_NAME: p15c-storage, COMPAT_STATE_DIR: /state, PUSH_COMPAT_NOTIFY_URL: http://push:8080 }
    tmpfs: *node-state-tmpfs
    labels: { <<: *labels, com.xpoint.p15c.role: storage }
    healthcheck: { <<: *health, test: [CMD, node, --eval, "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  file:
    <<: *service
    image: ${P15C_FILE_IMAGE_NAME:?P15C_FILE_IMAGE_NAME is required}
    build: { <<: *compat-build, args: { NODE_IMAGE: "${P15C_NODE_IMAGE}", SOURCE_SHA: "${P15C_DEVOPS_SHA}", SOURCE_TREE: "${P15C_DEVOPS_TREE}", OWNERSHIP_NONCE: "${P15C_OWNERSHIP_NONCE}", ROLE: file } }
    command: [node, tools/file-service/file-service.mjs]
    environment: { PORT: "8080", SERVICE_NAME: p15c-file, COMPAT_STATE_DIR: /state }
    tmpfs: *node-state-tmpfs
    labels: { <<: *labels, com.xpoint.p15c.role: file }
    healthcheck: { <<: *health, test: [CMD, node, --eval, "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  push:
    <<: *service
    image: ${P15C_PUSH_IMAGE_NAME:?P15C_PUSH_IMAGE_NAME is required}
    build: { <<: *compat-build, args: { NODE_IMAGE: "${P15C_NODE_IMAGE}", SOURCE_SHA: "${P15C_DEVOPS_SHA}", SOURCE_TREE: "${P15C_DEVOPS_TREE}", OWNERSHIP_NONCE: "${P15C_OWNERSHIP_NONCE}", ROLE: push } }
    command: [node, tools/push-service/push-service.mjs]
    environment: { PORT: "8080", SERVICE_NAME: p15c-push, COMPAT_STATE_DIR: /state }
    tmpfs: *node-state-tmpfs
    labels: { <<: *labels, com.xpoint.p15c.role: push }
    healthcheck: { <<: *health, test: [CMD, node, --eval, "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  calls:
    <<: *service
    image: ${P15C_CALLS_IMAGE_NAME:?P15C_CALLS_IMAGE_NAME is required}
    build: { <<: *compat-build, args: { NODE_IMAGE: "${P15C_NODE_IMAGE}", SOURCE_SHA: "${P15C_DEVOPS_SHA}", SOURCE_TREE: "${P15C_DEVOPS_TREE}", OWNERSHIP_NONCE: "${P15C_OWNERSHIP_NONCE}", ROLE: calls } }
    command: [node, tools/calls-service/calls-service.mjs]
    environment: { PORT: "8080", SERVICE_NAME: p15c-calls, CALLS_STATE_DIR: /state }
    tmpfs: *node-state-tmpfs
    labels: { <<: *labels, com.xpoint.p15c.role: calls }
    healthcheck: { <<: *health, test: [CMD, node, --eval, "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  test-client:
    <<: *service
    image: ${P15C_TEST_IMAGE_NAME:?P15C_TEST_IMAGE_NAME is required}
    build:
      context: ${P15C_DEVOPS_CONTEXT:?P15C_DEVOPS_CONTEXT is required}
      pull: false
      additional_contexts: { e2e_source: "${P15C_E2E_CONTEXT:?P15C_E2E_CONTEXT is required}" }
      args: { NODE_IMAGE: "${P15C_NODE_IMAGE}", SOURCE_SHA: "${P15C_E2E_SHA:?P15C_E2E_SHA is required}", SOURCE_TREE: "${P15C_E2E_TREE:?P15C_E2E_TREE is required}", OWNERSHIP_NONCE: "${P15C_OWNERSHIP_NONCE}" }
      labels: { org.opencontainers.image.revision: "${P15C_E2E_SHA}", org.opencontainers.image.source-tree: "${P15C_E2E_TREE}", org.opencontainers.image.source: deep-tests-e2e, com.xpoint.p15c.role: test-client, com.xpoint.evidence-class: headless-harness, com.xpoint.product-runtime: "false", com.xpoint.p15c.ownership-nonce: "${P15C_OWNERSHIP_NONCE}" }
      dockerfile_inline: |
        ARG NODE_IMAGE
        FROM $${NODE_IMAGE}
        ARG SOURCE_SHA SOURCE_TREE OWNERSHIP_NONCE
        LABEL org.opencontainers.image.revision="$${SOURCE_SHA}" org.opencontainers.image.source-tree="$${SOURCE_TREE}" org.opencontainers.image.source="deep-tests-e2e" com.xpoint.p15c.role="test-client" com.xpoint.evidence-class="headless-harness" com.xpoint.product-runtime="false" com.xpoint.p15c.ownership-nonce="$${OWNERSHIP_NONCE}"
        WORKDIR /tests
        COPY --from=e2e_source . .
        COPY --chown=node:node scripts/p15c-headless-contracts.mjs /p15c/p15c-headless-contracts.mjs
        USER node
    command: [node, /p15c/p15c-headless-contracts.mjs, test-client, http://calls:8080]
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/npm-cache
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      XNODE_URL: http://xnode-1:8080
      DEEP_REGISTRY_URL: http://registry:8080
      DEEP_STORAGE_URL: http://storage:8080
      DEEP_FILE_URL: http://file:8080
      DEEP_PUSH_URL: http://push:8080
      DEEP_STAKING_URL: http://staking-backend:8080
      DEEP_CALL_SIGNALING_BASE_URL: http://calls:8080
      DEEP_DEVNET_RPC_URL: http://contracts-devnet:8545
      DEEP_EXPECTED_CHAIN_ID: "0x7a69"
    labels: { <<: *labels, com.xpoint.p15c.role: test-client }
    depends_on:
      contracts-devnet: { condition: service_healthy }
      xnode-1: { condition: service_healthy }
      registry: { condition: service_healthy }
      staking-backend: { condition: service_healthy }
      storage: { condition: service_healthy }
      file: { condition: service_healthy }
      push: { condition: service_healthy }
      calls: { condition: service_healthy }

networks:
  runtime: { internal: true, labels: { com.xpoint.p15c.ownership-nonce: "${P15C_OWNERSHIP_NONCE}" } }

secrets:
  xnode-1-identity: { file: "${P15C_SECRET_DIR:?P15C_SECRET_DIR is required}/node-1.seed" }
  xnode-2-identity: { file: "${P15C_SECRET_DIR}/node-2.seed" }
  xnode-3-identity: { file: "${P15C_SECRET_DIR}/node-3.seed" }
  xnode-1-config: { file: "${P15C_SECRET_DIR}/node-1.config.json" }
  xnode-2-config: { file: "${P15C_SECRET_DIR}/node-2.config.json" }
  xnode-3-config: { file: "${P15C_SECRET_DIR}/node-3.config.json" }
