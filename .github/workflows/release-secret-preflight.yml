name: release-secret-preflight

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Named release candidate, for example deep-messenger-rc.1
        required: true
        type: string
      release_lane:
        description: Release lane to validate
        required: true
        default: staging
        type: string
      push_provider_service:
        description: Push provider service to validate
        required: true
        default: firebase
        type: choice
        options:
          - firebase
          - apns
          - huawei

permissions:
  contents: read

jobs:
  release-secret-preflight:
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    environment: ${{ inputs.release_lane }}
    steps:
      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          path: deep-devops

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check release secret preflight script
        run: node --check deep-devops/scripts/release-secret-preflight.mjs

      - name: Run release secret preflight
        run: >
          node deep-devops/scripts/release-secret-preflight.mjs
          --release-lane "${{ inputs.release_lane }}"
          --push-provider-service "${{ inputs.push_provider_service }}"
          --require-ci-repo-token
        env:
          DEEP_RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
          XPOINTLABS_CI_TOKEN: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          DEEP_PUSH_PROVIDER_CANARY_TOKEN: ${{ secrets.DEEP_PUSH_PROVIDER_CANARY_TOKEN }}
          PUSH_PROVIDER_BASE_URL: ${{ secrets.PUSH_PROVIDER_BASE_URL }}
          PUSH_PROVIDER_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_AUTH_HEADER }}
          PUSH_PROVIDER_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_BEARER_TOKEN }}
          PUSH_PROVIDER_FIREBASE_URL: ${{ secrets.PUSH_PROVIDER_FIREBASE_URL }}
          PUSH_PROVIDER_FIREBASE_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_FIREBASE_AUTH_HEADER }}
          PUSH_PROVIDER_FIREBASE_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_FIREBASE_BEARER_TOKEN }}
          PUSH_PROVIDER_APNS_URL: ${{ secrets.PUSH_PROVIDER_APNS_URL }}
          PUSH_PROVIDER_APNS_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_APNS_AUTH_HEADER }}
          PUSH_PROVIDER_APNS_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_APNS_BEARER_TOKEN }}
          PUSH_PROVIDER_HUAWEI_URL: ${{ secrets.PUSH_PROVIDER_HUAWEI_URL }}
          PUSH_PROVIDER_HUAWEI_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_HUAWEI_AUTH_HEADER }}
          PUSH_PROVIDER_HUAWEI_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_HUAWEI_BEARER_TOKEN }}

      - name: Prepare exact release preflight artifact manifest
        id: prepare_upload
        run: >
          node deep-devops/scripts/artifact-upload-manifest.mjs
          --root deep-devops/artifacts/release
          --require release-secret-preflight-summary.json
          --staging "${{ runner.temp }}/deep-upload/release-preflight"
          --manifest "${{ runner.temp }}/deep-upload/release-preflight-manifest.json"

      - name: Scan exact release preflight artifact manifest
        id: secret_scan
        if: always()
        run: >
          node deep-devops/scripts/artifact-upload-gate.mjs
          --manifest "${{ runner.temp }}/deep-upload/release-preflight-manifest.json"
          --staging-root "${{ runner.temp }}/deep-upload/release-preflight"
          --require release-secret-preflight-summary.json
          --summary "${{ runner.temp }}/deep-upload/release-preflight-scan.json"
          --bundle "${{ runner.temp }}/deep-upload/release-preflight-sealed-evidence.json"

      - name: Upload release secret preflight summary
        id: upload_release_preflight
        if: ${{ always() && steps.prepare_upload.outcome == 'success' && steps.secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-secret-preflight-artifacts
          path: ${{ runner.temp }}/deep-upload/release-preflight-sealed-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Download sealed release preflight evidence
        if: ${{ always() && steps.upload_release_preflight.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: release-secret-preflight-artifacts
          path: ${{ runner.temp }}/deep-upload/roundtrip-release-preflight

      - name: Verify sealed release preflight evidence round trip
        if: ${{ always() && steps.upload_release_preflight.outcome == 'success' }}
        run: >
          node deep-devops/scripts/sealed-evidence-bundle.mjs
          --bundle "${{ runner.temp }}/deep-upload/roundtrip-release-preflight/release-preflight-sealed-evidence.json"
          --expected-sha256 "${{ steps.secret_scan.outputs.bundle_sha256 }}"
          --actions-artifact-id "${{ steps.upload_release_preflight.outputs.artifact-id }}"
          --actions-artifact-digest "${{ steps.upload_release_preflight.outputs.artifact-digest }}"
          --receipt "${{ runner.temp }}/deep-upload/release-preflight-roundtrip-receipt.json"
