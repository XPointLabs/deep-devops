name: unit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master, 'release-candidate/**']

env:
  RELEASE_SOURCE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release superproject
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-platform
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          path: deep-devops

      - name: Checkout Deep repos
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xnode

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-registry-api
          ref: ${{ env.RELEASE_SOURCE_REF }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-registry-api

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-backend
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-backend

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-protocol

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-contracts
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-contracts

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-tests-e2e
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-tests-e2e

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.301

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test xnode/XNode.slnx --configuration Release --logger "trx;LogFileName=xnode.trx" -p:DeepProtocolSourceCutover=true
          dotnet test deep-registry-api/Deep.Registry.Api.slnx --configuration Release --logger "trx;LogFileName=registry.trx" -p:DeepProtocolLocalCutover=true -p:DeepProtocolSourceCutover=true
          dotnet test xpoint-staking-backend/XPoint.Staking.Backend.slnx --configuration Release --logger "trx;LogFileName=staking-backend.trx"
          dotnet test deep-protocol/Deep.Protocol.slnx --configuration Release --logger "trx;LogFileName=protocol.trx"
          cd deep-tests-e2e
          npm run fixtures:validate
          npm run compat
          cd ../deep-devops
          node --test ./tools/storage-service/storage-service-runtime.test.mjs
          node --test ./tools/file-service/file-service-runtime.test.mjs
          node --test ./tools/push-service/push-service-runtime.test.mjs
          node --test ./tools/calls-service/calls-service-runtime.test.mjs

      - name: Prepare exact failed-test artifact manifest
        id: prepare_unit_upload
        if: failure()
        run: >
          node deep-devops/scripts/artifact-upload-manifest.mjs
          --root deep-devops/artifacts
          --staging "${{ runner.temp }}/deep-upload/unit"
          --manifest "${{ runner.temp }}/deep-upload/unit-manifest.json"

      - name: Scan exact failed-test artifact manifest
        id: unit_secret_scan
        if: failure()
        run: >
          node deep-devops/scripts/artifact-upload-gate.mjs
          --manifest "${{ runner.temp }}/deep-upload/unit-manifest.json"
          --staging-root "${{ runner.temp }}/deep-upload/unit"
          --summary deep-devops/artifacts/security/unit-upload-secret-scan.json
          --bundle "${{ runner.temp }}/deep-upload/unit-sealed-evidence.json"

      - name: Upload unit artifacts
        id: upload_unit
        if: ${{ failure() && steps.prepare_unit_upload.outcome == 'success' && steps.unit_secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-artifacts
          path: ${{ runner.temp }}/deep-upload/unit-sealed-evidence.json
          if-no-files-found: error

      - name: Download sealed unit evidence
        if: ${{ always() && steps.upload_unit.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: unit-artifacts
          path: ${{ runner.temp }}/deep-upload/roundtrip-unit

      - name: Verify sealed unit evidence round trip
        if: ${{ always() && steps.upload_unit.outcome == 'success' }}
        run: >
          node deep-devops/scripts/sealed-evidence-bundle.mjs
          --bundle "${{ runner.temp }}/deep-upload/roundtrip-unit/unit-sealed-evidence.json"
          --expected-sha256 "${{ steps.unit_secret_scan.outputs.bundle_sha256 }}"
          --actions-artifact-id "${{ steps.upload_unit.outputs.artifact-id }}"
          --actions-artifact-digest "${{ steps.upload_unit.outputs.artifact-digest }}"
          --receipt "${{ runner.temp }}/deep-upload/unit-roundtrip-receipt.json"

  security-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout release superproject
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-platform
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          path: deep-devops

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-protocol

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xnode

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-registry-api
          ref: ${{ env.RELEASE_SOURCE_REF }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-registry-api

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-backend
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-backend

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-contracts
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-contracts

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-client-shared
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-client-shared

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-client-maui
          ref: ${{ env.RELEASE_SOURCE_REF }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-client-maui

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-tests-e2e
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-tests-e2e

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.301

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Restore MAUI workloads for dependency audit
        run: dotnet workload restore deep-client-maui/src/Deep.Client.Maui/Deep.Client.Maui.csproj

      - name: Run security gate
        run: node deep-devops/scripts/security-gate.mjs

      - name: Prepare exact security artifact manifest
        id: prepare_security_upload
        if: always()
        run: >
          node deep-devops/scripts/artifact-upload-manifest.mjs
          --root deep-devops/artifacts/security
          --require secret-scan.json
          --require sbom.json
          --require dependency-audit.json
          --require security-gate-summary.json
          --staging "${{ runner.temp }}/deep-upload/security"
          --manifest "${{ runner.temp }}/deep-upload/security-manifest.json"

      - name: Scan exact security artifact manifest
        id: security_secret_scan
        if: always()
        run: >
          node deep-devops/scripts/artifact-upload-gate.mjs
          --manifest "${{ runner.temp }}/deep-upload/security-manifest.json"
          --staging-root "${{ runner.temp }}/deep-upload/security"
          --require secret-scan.json
          --require sbom.json
          --require dependency-audit.json
          --require security-gate-summary.json
          --summary "${{ runner.temp }}/deep-upload/security-scan.json"
          --bundle "${{ runner.temp }}/deep-upload/security-sealed-evidence.json"

      - name: Upload security artifacts
        id: upload_security
        if: ${{ always() && steps.prepare_security_upload.outcome == 'success' && steps.security_secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-artifacts
          path: ${{ runner.temp }}/deep-upload/security-sealed-evidence.json
          if-no-files-found: error

      - name: Download sealed security evidence
        if: ${{ always() && steps.upload_security.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: security-gate-artifacts
          path: ${{ runner.temp }}/deep-upload/roundtrip-security

      - name: Verify sealed security evidence round trip
        if: ${{ always() && steps.upload_security.outcome == 'success' }}
        run: >
          node deep-devops/scripts/sealed-evidence-bundle.mjs
          --bundle "${{ runner.temp }}/deep-upload/roundtrip-security/security-sealed-evidence.json"
          --expected-sha256 "${{ steps.security_secret_scan.outputs.bundle_sha256 }}"
          --actions-artifact-id "${{ steps.upload_security.outputs.artifact-id }}"
          --actions-artifact-digest "${{ steps.upload_security.outputs.artifact-digest }}"
          --receipt "${{ runner.temp }}/deep-upload/security-roundtrip-receipt.json"

  release-gate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release superproject
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-platform
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          path: deep-devops

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xnode

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-registry-api
          ref: ${{ env.RELEASE_SOURCE_REF }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-registry-api

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-client-shared
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-client-shared

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-client-maui
          ref: ${{ env.RELEASE_SOURCE_REF }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-client-maui

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check release gate scripts
        run: node --check deep-devops/scripts/release-gate-contracts.mjs

      - name: Validate production readiness evidence templates
        run: node deep-devops/scripts/release-gate-contracts.mjs
        env:
          DEEP_RELEASE_CONTRACT_ARTIFACT_ROOT: ${{ runner.temp }}/deep-release-gate-contracts

      - name: Prepare exact release gate contract artifact manifest
        id: prepare_release_contract_upload
        if: always()
        run: >
          node deep-devops/scripts/artifact-upload-manifest.mjs
          --root "${{ runner.temp }}/deep-release-gate-contracts"
          --require release/release-gate-contract-summary.json
          --staging "${{ runner.temp }}/deep-upload/release-contracts"
          --manifest "${{ runner.temp }}/deep-upload/release-contracts-manifest.json"

      - name: Scan exact release gate contract artifact manifest
        id: release_contract_secret_scan
        if: always()
        run: >
          node deep-devops/scripts/artifact-upload-gate.mjs
          --manifest "${{ runner.temp }}/deep-upload/release-contracts-manifest.json"
          --staging-root "${{ runner.temp }}/deep-upload/release-contracts"
          --require release/release-gate-contract-summary.json
          --summary "${{ runner.temp }}/deep-release-gate-contracts/security/pre-upload-secret-scan.json"
          --bundle "${{ runner.temp }}/deep-upload/release-contracts-sealed-evidence.json"

      - name: Upload release gate contract artifacts
        id: upload_release_contracts
        if: ${{ always() && steps.prepare_release_contract_upload.outcome == 'success' && steps.release_contract_secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-contract-artifacts
          path: ${{ runner.temp }}/deep-upload/release-contracts-sealed-evidence.json
          if-no-files-found: error

      - name: Download sealed release gate contract evidence
        if: ${{ always() && steps.upload_release_contracts.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: release-gate-contract-artifacts
          path: ${{ runner.temp }}/deep-upload/roundtrip-release-contracts

      - name: Verify sealed release gate contract evidence round trip
        if: ${{ always() && steps.upload_release_contracts.outcome == 'success' }}
        run: >
          node deep-devops/scripts/sealed-evidence-bundle.mjs
          --bundle "${{ runner.temp }}/deep-upload/roundtrip-release-contracts/release-contracts-sealed-evidence.json"
          --expected-sha256 "${{ steps.release_contract_secret_scan.outputs.bundle_sha256 }}"
          --actions-artifact-id "${{ steps.upload_release_contracts.outputs.artifact-id }}"
          --actions-artifact-digest "${{ steps.upload_release_contracts.outputs.artifact-digest }}"
          --receipt "${{ runner.temp }}/deep-upload/release-contracts-roundtrip-receipt.json"
