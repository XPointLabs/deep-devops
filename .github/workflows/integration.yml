name: integration

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          path: deep-devops

      - name: Checkout sibling repos
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-tests-e2e
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-tests-e2e

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xnode

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-registry-api
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-registry-api

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-backend
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-backend

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-contracts
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-contracts

      - name: Run e2e smoke
        shell: pwsh
        run: ./deep-devops/scripts/test-env.ps1 -Suite smoke

      - name: Run backend-external no-mock smoke
        shell: pwsh
        run: ./deep-devops/scripts/test-env.ps1 -Suite smoke -BackendMode external -ManagedExternalProfile backend-external -RequireRouterNoMock

      - name: Run multi-node no-mock rehearsal
        shell: pwsh
        run: ./deep-devops/scripts/multi-node-rehearsal.ps1

      - name: Prepare exact integration artifact manifest
        id: prepare_upload
        run: >
          node deep-devops/scripts/artifact-upload-manifest.mjs
          --root deep-devops/artifacts
          --staging "${{ runner.temp }}/deep-upload/integration"
          --manifest "${{ runner.temp }}/deep-upload/integration-manifest.json"

      - name: Scan exact integration artifact manifest
        id: secret_scan
        if: always()
        run: >
          node deep-devops/scripts/artifact-upload-gate.mjs
          --manifest "${{ runner.temp }}/deep-upload/integration-manifest.json"
          --staging-root "${{ runner.temp }}/deep-upload/integration"
          --summary "${{ runner.temp }}/deep-upload/integration-scan.json"

      - name: Upload integration artifacts
        if: ${{ always() && steps.prepare_upload.outcome == 'success' && steps.secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: ${{ runner.temp }}/deep-upload/integration/**
          if-no-files-found: error
