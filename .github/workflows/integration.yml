name: integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  integration:
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    steps:
      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          path: deep-devops

      - name: Checkout sibling repos
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-tests-e2e
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-tests-e2e

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xnode

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-registry-api
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-registry-api

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-backend
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-backend

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-contracts
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-contracts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run e2e smoke
        shell: pwsh
        run: ./deep-devops/scripts/test-env.ps1 -Suite smoke

      - name: Run backend-external no-mock smoke
        shell: pwsh
        run: ./deep-devops/scripts/test-env.ps1 -Suite smoke -BackendMode external -ManagedExternalProfile backend-external -RequireRouterNoMock

      - name: Run multi-node no-mock rehearsal
        shell: pwsh
        run: ./deep-devops/scripts/multi-node-rehearsal.ps1

      - name: Prepare exact integration artifact manifest
        id: prepare_upload
        run: >
          node deep-devops/scripts/artifact-upload-manifest.mjs
          --root deep-devops/artifacts
          --require runtime.gate.json
          --require runtime.snapshot.json
          --require compose.topology.redacted.json
          --require security/secret-scan-summary.json
          --require test-results/multi-node-topology.json
          --staging "${{ runner.temp }}/deep-upload/integration"
          --manifest "${{ runner.temp }}/deep-upload/integration-manifest.json"

      - name: Scan exact integration artifact manifest
        id: secret_scan
        if: always()
        run: >
          node deep-devops/scripts/artifact-upload-gate.mjs
          --manifest "${{ runner.temp }}/deep-upload/integration-manifest.json"
          --staging-root "${{ runner.temp }}/deep-upload/integration"
          --require runtime.gate.json
          --require runtime.snapshot.json
          --require compose.topology.redacted.json
          --require security/secret-scan-summary.json
          --require test-results/multi-node-topology.json
          --summary "${{ runner.temp }}/deep-upload/integration-scan.json"
          --bundle "${{ runner.temp }}/deep-upload/integration-sealed-evidence.json"

      - name: Upload integration artifacts
        id: upload_integration
        if: ${{ always() && steps.prepare_upload.outcome == 'success' && steps.secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: ${{ runner.temp }}/deep-upload/integration-sealed-evidence.json
          if-no-files-found: error

      - name: Download sealed integration evidence
        if: ${{ always() && steps.upload_integration.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: integration-artifacts
          path: ${{ runner.temp }}/deep-upload/roundtrip-integration

      - name: Verify sealed integration evidence round trip
        if: ${{ always() && steps.upload_integration.outcome == 'success' }}
        run: >
          node deep-devops/scripts/sealed-evidence-bundle.mjs
          --bundle "${{ runner.temp }}/deep-upload/roundtrip-integration/integration-sealed-evidence.json"
          --expected-sha256 "${{ steps.secret_scan.outputs.bundle_sha256 }}"
          --actions-artifact-id "${{ steps.upload_integration.outputs.artifact-id }}"
          --actions-artifact-digest "${{ steps.upload_integration.outputs.artifact-digest }}"
          --receipt "${{ runner.temp }}/deep-upload/integration-roundtrip-receipt.json"
