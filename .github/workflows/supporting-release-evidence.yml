name: supporting-release-evidence

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Named release candidate, for example deep-messenger-rc.1
        required: true
        type: string
      artifact_name:
        description: Optional retained artifact name; defaults to supporting-release-evidence-<rc>
        required: false
        default: ''
        type: string
      p6_evidence_run_id:
        description: Optional deep-devops workflow run id with a retained artifact containing the four P6 manifests
        required: false
        default: ''
        type: string
      p6_evidence_artifact_name:
        description: Optional artifact name from p6_evidence_run_id containing client/ops/security/GA manifests
        required: false
        default: ''
        type: string
      release_lane:
        description: Release lane recorded in the push-provider canary artifact
        required: false
        default: staging
        type: string
      push_provider_service:
        description: Push provider service to probe
        required: true
        default: firebase
        type: choice
        options:
          - firebase
          - apns
          - huawei

permissions:
  contents: read
  actions: read

env:
  RELEASE_SOURCE_REF: ${{ github.ref_name }}

jobs:
  supporting-release-evidence:
    runs-on: ubuntu-latest
    environment: ${{ inputs.release_lane }}
    timeout-minutes: 120
    steps:
      - name: Checkout release superproject
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-platform
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          path: deep-devops

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-tests-e2e
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-tests-e2e

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xnode

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-registry-api
          ref: ${{ env.RELEASE_SOURCE_REF }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-registry-api

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-protocol
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-protocol

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-backend
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-backend

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-contracts
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-contracts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.301

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect attached CI prerequisite runs
        id: attached_ci
        continue-on-error: true
        run: >
          node deep-devops/scripts/collect-attached-ci-source.mjs
          --owner "${{ github.repository_owner }}"
          --branch "${{ github.ref_name }}"
          --release-candidate "${{ inputs.release_candidate }}"
          --require-success
        env:
          DEEP_GITHUB_TOKEN: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          DEEP_RELEASE_CANDIDATE: ${{ inputs.release_candidate }}

      - name: Validate staging push provider canary configuration
        id: provider_config
        run: >
          node deep-devops/scripts/release-secret-preflight.mjs
          --release-lane "${{ inputs.release_lane }}"
          --push-provider-service "${{ inputs.push_provider_service }}"
          --require-ci-repo-token
        env:
          DEEP_RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
          XPOINTLABS_CI_TOKEN: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          DEEP_PUSH_PROVIDER_CANARY_TOKEN: ${{ secrets.DEEP_PUSH_PROVIDER_CANARY_TOKEN }}
          PUSH_PROVIDER_BASE_URL: ${{ secrets.PUSH_PROVIDER_BASE_URL }}
          PUSH_PROVIDER_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_AUTH_HEADER }}
          PUSH_PROVIDER_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_BEARER_TOKEN }}
          PUSH_PROVIDER_FIREBASE_URL: ${{ secrets.PUSH_PROVIDER_FIREBASE_URL }}
          PUSH_PROVIDER_FIREBASE_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_FIREBASE_AUTH_HEADER }}
          PUSH_PROVIDER_FIREBASE_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_FIREBASE_BEARER_TOKEN }}
          PUSH_PROVIDER_APNS_URL: ${{ secrets.PUSH_PROVIDER_APNS_URL }}
          PUSH_PROVIDER_APNS_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_APNS_AUTH_HEADER }}
          PUSH_PROVIDER_APNS_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_APNS_BEARER_TOKEN }}
          PUSH_PROVIDER_HUAWEI_URL: ${{ secrets.PUSH_PROVIDER_HUAWEI_URL }}
          PUSH_PROVIDER_HUAWEI_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_HUAWEI_AUTH_HEADER }}
          PUSH_PROVIDER_HUAWEI_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_HUAWEI_BEARER_TOKEN }}

      - name: Prepare exact release secret preflight upload manifest
        id: prepare_preflight_upload
        if: always()
        run: >
          node deep-devops/scripts/artifact-upload-manifest.mjs
          --file deep-devops/artifacts/release/release-secret-preflight-summary.json
          --require release-secret-preflight-summary.json
          --staging "${{ runner.temp }}/deep-upload/supporting-preflight"
          --manifest "${{ runner.temp }}/deep-upload/supporting-preflight-manifest.json"

      - name: Scan exact release secret preflight upload manifest
        id: preflight_secret_scan
        if: always()
        run: >
          node deep-devops/scripts/artifact-upload-gate.mjs
          --manifest "${{ runner.temp }}/deep-upload/supporting-preflight-manifest.json"
          --staging-root "${{ runner.temp }}/deep-upload/supporting-preflight"
          --require release-secret-preflight-summary.json
          --summary "${{ runner.temp }}/deep-upload/supporting-preflight-scan.json"
          --bundle "${{ runner.temp }}/deep-upload/supporting-preflight-sealed-evidence.json"

      - name: Upload release secret preflight summary
        id: upload_preflight
        if: ${{ always() && steps.prepare_preflight_upload.outcome == 'success' && steps.preflight_secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-secret-preflight-${{ inputs.release_candidate }}
          path: ${{ runner.temp }}/deep-upload/supporting-preflight-sealed-evidence.json
          if-no-files-found: error

      - name: Download sealed supporting preflight evidence
        if: ${{ always() && steps.upload_preflight.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: release-secret-preflight-${{ inputs.release_candidate }}
          path: ${{ runner.temp }}/deep-upload/roundtrip-supporting-preflight

      - name: Verify sealed supporting preflight evidence round trip
        if: ${{ always() && steps.upload_preflight.outcome == 'success' }}
        run: >
          node deep-devops/scripts/sealed-evidence-bundle.mjs
          --bundle "${{ runner.temp }}/deep-upload/roundtrip-supporting-preflight/supporting-preflight-sealed-evidence.json"
          --expected-sha256 "${{ steps.preflight_secret_scan.outputs.bundle_sha256 }}"
          --actions-artifact-id "${{ steps.upload_preflight.outputs.artifact-id }}"
          --actions-artifact-digest "${{ steps.upload_preflight.outputs.artifact-digest }}"
          --receipt "${{ runner.temp }}/deep-upload/supporting-preflight-roundtrip-receipt.json"

      - name: Validate P6 evidence artifact inputs
        id: p6_inputs
        if: ${{ steps.provider_config.outcome == 'success' }}
        shell: pwsh
        run: |
          $p6RunId = '${{ inputs.p6_evidence_run_id }}'.Trim()
          $p6ArtifactName = '${{ inputs.p6_evidence_artifact_name }}'.Trim()

          if ([string]::IsNullOrWhiteSpace($p6RunId) -and [string]::IsNullOrWhiteSpace($p6ArtifactName)) {
            Write-Host 'No P6 evidence artifact requested; supporting bundle will include P6 manifests only if generated by earlier steps.'
            return
          }

          $missing = @()
          if ([string]::IsNullOrWhiteSpace($p6RunId)) {
            $missing += 'p6_evidence_run_id'
          }
          if ([string]::IsNullOrWhiteSpace($p6ArtifactName)) {
            $missing += 'p6_evidence_artifact_name'
          }

          if ($missing.Count -gt 0) {
            throw "P6 evidence artifact inputs must be provided together. Missing: $($missing -join ', ')"
          }

      - name: Run backend-external no-mock full e2e with push-provider canary
        id: full_suite
        if: ${{ steps.provider_config.outcome == 'success' && steps.p6_inputs.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $providerSinkProcess = $null
          try {
            $configuredProviderUrls = @(
              $env:PUSH_PROVIDER_BASE_URL,
              $env:PUSH_PROVIDER_FIREBASE_URL,
              $env:PUSH_PROVIDER_APNS_URL,
              $env:PUSH_PROVIDER_HUAWEI_URL
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

            if ($configuredProviderUrls.Count -eq 0) {
              $providerSinkScriptPath = Join-Path $env:RUNNER_TEMP 'push-provider-sink.cjs'
              @(
                "const http = require('node:http');",
                '',
                "const server = http.createServer(async (req, res) => {",
                "  for await (const _ of req) {",
                "    // Drain request bodies so the sink can accept provider deliveries from the push service.",
                "  }",
                '',
                "  res.writeHead(200, { 'content-type': 'application/json' });",
                "  res.end(JSON.stringify({ ok: true }));",
                '});',
                '',
                "server.listen(19123, '0.0.0.0');"
              ) | Set-Content -Path $providerSinkScriptPath -Encoding utf8

              $providerSinkProcess = Start-Process -FilePath node -ArgumentList $providerSinkScriptPath -PassThru
              $env:PUSH_PROVIDER_BASE_URL = 'http://host.docker.internal:19123'
            }

            $testEnvArgs = @{
              Suite = 'full'
              BackendMode = 'external'
              ManagedExternalProfile = 'backend-external'
              RequireRouterNoMock = $true
              RequirePushProviderCanary = $true
            }

            ./deep-devops/scripts/test-env.ps1 @testEnvArgs
          }
          finally {
            if ($null -ne $providerSinkProcess -and -not $providerSinkProcess.HasExited) {
              Stop-Process -Id $providerSinkProcess.Id -Force
            }
          }
        env:
          DEEP_PUSH_PROVIDER_CANARY_SERVICE: ${{ inputs.push_provider_service }}
          DEEP_RELEASE_LANE: ${{ inputs.release_lane }}
          DEEP_PUSH_PROVIDER_CANARY_TOKEN: ${{ secrets.DEEP_PUSH_PROVIDER_CANARY_TOKEN }}
          PUSH_PROVIDER_BASE_URL: ${{ secrets.PUSH_PROVIDER_BASE_URL }}
          PUSH_PROVIDER_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_AUTH_HEADER }}
          PUSH_PROVIDER_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_BEARER_TOKEN }}
          PUSH_PROVIDER_FIREBASE_URL: ${{ secrets.PUSH_PROVIDER_FIREBASE_URL }}
          PUSH_PROVIDER_FIREBASE_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_FIREBASE_AUTH_HEADER }}
          PUSH_PROVIDER_FIREBASE_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_FIREBASE_BEARER_TOKEN }}
          PUSH_PROVIDER_APNS_URL: ${{ secrets.PUSH_PROVIDER_APNS_URL }}
          PUSH_PROVIDER_APNS_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_APNS_AUTH_HEADER }}
          PUSH_PROVIDER_APNS_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_APNS_BEARER_TOKEN }}
          PUSH_PROVIDER_HUAWEI_URL: ${{ secrets.PUSH_PROVIDER_HUAWEI_URL }}
          PUSH_PROVIDER_HUAWEI_AUTH_HEADER: ${{ secrets.PUSH_PROVIDER_HUAWEI_AUTH_HEADER }}
          PUSH_PROVIDER_HUAWEI_BEARER_TOKEN: ${{ secrets.PUSH_PROVIDER_HUAWEI_BEARER_TOKEN }}

      - name: Run rollback drill
        id: rollback_drill
        if: ${{ always() && steps.provider_config.outcome == 'success' && steps.p6_inputs.outcome == 'success' }}
        continue-on-error: true
        run: node deep-devops/scripts/rollback-drill.mjs

      - name: Run registry recovery drill
        id: registry_recovery
        if: ${{ always() && steps.provider_config.outcome == 'success' && steps.p6_inputs.outcome == 'success' }}
        continue-on-error: true
        run: node deep-devops/scripts/registry-recovery-drill.mjs

      - name: Download xnode C3 artifacts
        id: download_router_c3
        if: ${{ always() && steps.provider_config.outcome == 'success' && steps.p6_inputs.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: c3-test-results
          path: deep-devops/artifacts/hydrated/xnode-c3
          github-token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          repository: ${{ github.repository_owner }}/xnode
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          run-id: ${{ steps.attached_ci.outputs.node_router_c3_run_id }}

      - name: Run observability gate
        id: observability
        if: ${{ always() && steps.provider_config.outcome == 'success' && steps.p6_inputs.outcome == 'success' }}
        continue-on-error: true
        run: node deep-devops/scripts/observability-gate.mjs
        env:
          XNODE_C3_ARTIFACT: ${{ github.workspace }}/deep-devops/artifacts/hydrated/xnode-c3/latest.json

      - name: Download P6 evidence manifests
        id: download_p6_evidence
        if: ${{ always() && steps.provider_config.outcome == 'success' && steps.p6_inputs.outcome == 'success' && inputs.p6_evidence_run_id != '' && inputs.p6_evidence_artifact_name != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.p6_evidence_artifact_name }}
          path: deep-devops/artifacts/hydrated/p6-evidence
          github-token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          repository: ${{ github.repository }}
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          run-id: ${{ inputs.p6_evidence_run_id }}

      - name: Verify and extract sealed P6 evidence manifests
        if: ${{ always() && steps.download_p6_evidence.outcome == 'success' }}
        run: >
          node deep-devops/scripts/sealed-evidence-bundle.mjs
          --bundle deep-devops/artifacts/hydrated/p6-evidence/p6-sealed-evidence.json
          --extract-dir deep-devops/artifacts/hydrated/p6-evidence-extracted
          --expected-source-run-id "${{ inputs.p6_evidence_run_id }}"

      - name: Hydrate P6 evidence manifests
        id: hydrate_p6_evidence
        if: ${{ always() && steps.provider_config.outcome == 'success' && steps.p6_inputs.outcome == 'success' && inputs.p6_evidence_run_id != '' && inputs.p6_evidence_artifact_name != '' }}
        continue-on-error: true
        run: >
          node deep-devops/scripts/hydrate-release-artifact-bundle.mjs
          --input-dir deep-devops/artifacts/hydrated/p6-evidence-extracted
          --only client-device-acceptance,ops-deployment-evidence,security-audit-signoff,ga-decision

      - name: Bundle supporting release evidence
        id: bundle
        if: ${{ always() && steps.provider_config.outcome == 'success' && steps.p6_inputs.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $bundleArgs = @(
            'deep-devops/scripts/bundle-supporting-release-evidence.mjs',
            '--source-root',
            'deep-devops/artifacts',
            '--output-dir',
            'deep-devops/artifacts/supporting-release-evidence'
          )

          if ('${{ inputs.p6_evidence_run_id }}' -ne '' -and '${{ inputs.p6_evidence_artifact_name }}' -ne '') {
            $bundleArgs += '--require-all'
          }

          node @bundleArgs

      - name: Fail closed before supporting evidence publication
        id: generation_complete
        if: always()
        shell: pwsh
        run: |
          $failed = @()
          $providerConfigOutcome = '${{ steps.provider_config.outcome }}'
          $p6InputsOutcome = '${{ steps.p6_inputs.outcome }}'
          if ($providerConfigOutcome -ne 'success') { $failed += 'provider_config' }
          if ($providerConfigOutcome -eq 'success' -and $p6InputsOutcome -ne 'success') { $failed += 'p6_inputs' }
          if ($providerConfigOutcome -eq 'success' -and $p6InputsOutcome -eq 'success') {
            $p6EvidenceExpected = '${{ inputs.p6_evidence_run_id }}' -ne '' -and '${{ inputs.p6_evidence_artifact_name }}' -ne ''
            if ('${{ steps.full_suite.outcome }}' -ne 'success') { $failed += 'full_suite' }
            if ('${{ steps.rollback_drill.outcome }}' -ne 'success') { $failed += 'rollback_drill' }
            if ('${{ steps.registry_recovery.outcome }}' -ne 'success') { $failed += 'registry_recovery' }
            if ('${{ steps.attached_ci.outcome }}' -ne 'success') { $failed += 'attached_ci' }
            if ('${{ steps.download_router_c3.outcome }}' -ne 'success') { $failed += 'download_router_c3' }
            if ('${{ steps.observability.outcome }}' -ne 'success') { $failed += 'observability' }
            if ($p6EvidenceExpected -and '${{ steps.download_p6_evidence.outcome }}' -ne 'success') { $failed += 'download_p6_evidence' }
            if ($p6EvidenceExpected -and '${{ steps.hydrate_p6_evidence.outcome }}' -ne 'success') { $failed += 'hydrate_p6_evidence' }
            if ('${{ steps.bundle.outcome }}' -ne 'success') { $failed += 'bundle' }
          }
          if ($failed.Count -gt 0) {
            throw "Supporting release evidence generation failed before publication: $($failed -join ', ')"
          }

      - name: Prepare exact supporting evidence upload manifest
        id: prepare_bundle_upload
        if: ${{ always() && steps.generation_complete.outcome == 'success' }}
        run: >
          node deep-devops/scripts/artifact-upload-manifest.mjs
          --root deep-devops/artifacts/supporting-release-evidence
          --require supporting-release-evidence-summary.json
          --require test-results/push-provider-canary.json
          --require test-results/rollback-drill.json
          --require test-results/registry-recovery.json
          --require observability/observability-gate-summary.json
          --staging "${{ runner.temp }}/deep-upload/supporting-bundle"
          --manifest "${{ runner.temp }}/deep-upload/supporting-bundle-manifest.json"

      - name: Scan exact supporting evidence upload manifest
        id: bundle_secret_scan
        if: ${{ always() && steps.generation_complete.outcome == 'success' }}
        run: >
          node deep-devops/scripts/artifact-upload-gate.mjs
          --manifest "${{ runner.temp }}/deep-upload/supporting-bundle-manifest.json"
          --staging-root "${{ runner.temp }}/deep-upload/supporting-bundle"
          --require supporting-release-evidence-summary.json
          --require test-results/push-provider-canary.json
          --require test-results/rollback-drill.json
          --require test-results/registry-recovery.json
          --require observability/observability-gate-summary.json
          --summary "${{ runner.temp }}/deep-upload/supporting-bundle-scan.json"
          --bundle "${{ runner.temp }}/deep-upload/supporting-bundle-sealed-evidence.json"

      - name: Upload supporting release evidence bundle
        id: upload_supporting_bundle
        if: ${{ always() && steps.generation_complete.outcome == 'success' && steps.prepare_bundle_upload.outcome == 'success' && steps.bundle_secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || format('supporting-release-evidence-{0}', inputs.release_candidate) }}
          path: ${{ runner.temp }}/deep-upload/supporting-bundle-sealed-evidence.json
          if-no-files-found: error

      - name: Download sealed supporting release evidence
        if: ${{ always() && steps.upload_supporting_bundle.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name || format('supporting-release-evidence-{0}', inputs.release_candidate) }}
          path: ${{ runner.temp }}/deep-upload/roundtrip-supporting-bundle

      - name: Verify sealed supporting release evidence round trip
        if: ${{ always() && steps.upload_supporting_bundle.outcome == 'success' }}
        run: >
          node deep-devops/scripts/sealed-evidence-bundle.mjs
          --bundle "${{ runner.temp }}/deep-upload/roundtrip-supporting-bundle/supporting-bundle-sealed-evidence.json"
          --expected-sha256 "${{ steps.bundle_secret_scan.outputs.bundle_sha256 }}"
          --actions-artifact-id "${{ steps.upload_supporting_bundle.outputs.artifact-id }}"
          --actions-artifact-digest "${{ steps.upload_supporting_bundle.outputs.artifact-digest }}"
          --receipt "${{ runner.temp }}/deep-upload/supporting-bundle-roundtrip-receipt.json"

      - name: Fail if supporting evidence generation is incomplete
        if: always()
        shell: pwsh
        run: |
          $failed = @()
          $providerConfigOutcome = '${{ steps.provider_config.outcome }}'
          if ($providerConfigOutcome -ne 'success') {
            $failed += 'provider_config'
          }

          $p6InputsOutcome = '${{ steps.p6_inputs.outcome }}'
          if ($providerConfigOutcome -eq 'success' -and $p6InputsOutcome -ne 'success') {
            $failed += 'p6_inputs'
          }

          if ($providerConfigOutcome -eq 'success' -and $p6InputsOutcome -eq 'success') {
            $p6EvidenceExpected = '${{ inputs.p6_evidence_run_id }}' -ne '' -and '${{ inputs.p6_evidence_artifact_name }}' -ne ''
            if ('${{ steps.full_suite.outcome }}' -ne 'success') {
              $failed += 'full_suite'
            }
            if ('${{ steps.rollback_drill.outcome }}' -ne 'success') {
              $failed += 'rollback_drill'
            }
            if ('${{ steps.registry_recovery.outcome }}' -ne 'success') {
              $failed += 'registry_recovery'
            }
            if ('${{ steps.attached_ci.outcome }}' -ne 'success') {
              $failed += 'attached_ci'
            }
            if ('${{ steps.download_router_c3.outcome }}' -ne 'success') {
              $failed += 'download_router_c3'
            }
            if ('${{ steps.observability.outcome }}' -ne 'success') {
              $failed += 'observability'
            }
            if ($p6EvidenceExpected -and '${{ steps.download_p6_evidence.outcome }}' -ne 'success') {
              $failed += 'download_p6_evidence'
            }
            if ($p6EvidenceExpected -and '${{ steps.hydrate_p6_evidence.outcome }}' -ne 'success') {
              $failed += 'hydrate_p6_evidence'
            }
            if ('${{ steps.bundle.outcome }}' -ne 'success') {
              $failed += 'bundle'
            }
            if ('${{ steps.prepare_bundle_upload.outcome }}' -ne 'success') {
              $failed += 'prepare_bundle_upload'
            }
            if ('${{ steps.bundle_secret_scan.outcome }}' -ne 'success') {
              $failed += 'bundle_secret_scan'
            }
          }

          if ($failed.Count -gt 0) {
            throw "Supporting release evidence workflow failed steps: $($failed -join ', ')"
          }
