name: nightly-full-e2e

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

jobs:
  full-e2e:
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    timeout-minutes: 90
    steps:
      - name: Checkout devops
        uses: actions/checkout@v4
        with:
          path: deep-devops

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-tests-e2e
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-tests-e2e

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xnode
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xnode

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deep-registry-api
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: deep-registry-api

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-backend
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-backend

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/xpoint-staking-contracts
          token: ${{ secrets.XPOINTLABS_CI_TOKEN || github.token }}
          path: xpoint-staking-contracts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run compat full e2e
        shell: pwsh
        run: ./deep-devops/scripts/test-env.ps1 -Suite full

      - name: Run backend-external no-mock full e2e
        shell: pwsh
        run: ./deep-devops/scripts/test-env.ps1 -Suite full -BackendMode external -ManagedExternalProfile backend-external -RequireRouterNoMock

      - name: Prepare exact nightly artifact manifest
        id: prepare_upload
        run: >
          node deep-devops/scripts/artifact-upload-manifest.mjs
          --root deep-devops/artifacts
          --require runtime.gate.json
          --require runtime.snapshot.json
          --require compose.topology.redacted.json
          --require security/secret-scan-summary.json
          --require test-results/backend-load-smoke.json
          --require test-results/backend-restart-smoke.json
          --staging "${{ runner.temp }}/deep-upload/nightly"
          --manifest "${{ runner.temp }}/deep-upload/nightly-manifest.json"

      - name: Scan exact nightly artifact manifest
        id: secret_scan
        if: always()
        run: >
          node deep-devops/scripts/artifact-upload-gate.mjs
          --manifest "${{ runner.temp }}/deep-upload/nightly-manifest.json"
          --staging-root "${{ runner.temp }}/deep-upload/nightly"
          --require runtime.gate.json
          --require runtime.snapshot.json
          --require compose.topology.redacted.json
          --require security/secret-scan-summary.json
          --require test-results/backend-load-smoke.json
          --require test-results/backend-restart-smoke.json
          --summary "${{ runner.temp }}/deep-upload/nightly-scan.json"
          --bundle "${{ runner.temp }}/deep-upload/nightly-sealed-evidence.json"

      - name: Upload redacted nightly evidence
        id: upload_nightly
        if: ${{ always() && steps.prepare_upload.outcome == 'success' && steps.secret_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-artifacts
          path: ${{ runner.temp }}/deep-upload/nightly-sealed-evidence.json
          if-no-files-found: error

      - name: Download sealed nightly evidence
        if: ${{ always() && steps.upload_nightly.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: nightly-e2e-artifacts
          path: ${{ runner.temp }}/deep-upload/roundtrip-nightly

      - name: Verify sealed nightly evidence round trip
        if: ${{ always() && steps.upload_nightly.outcome == 'success' }}
        run: >
          node deep-devops/scripts/sealed-evidence-bundle.mjs
          --bundle "${{ runner.temp }}/deep-upload/roundtrip-nightly/nightly-sealed-evidence.json"
          --expected-sha256 "${{ steps.secret_scan.outputs.bundle_sha256 }}"
          --actions-artifact-id "${{ steps.upload_nightly.outputs.artifact-id }}"
          --actions-artifact-digest "${{ steps.upload_nightly.outputs.artifact-digest }}"
          --receipt "${{ runner.temp }}/deep-upload/nightly-roundtrip-receipt.json"
