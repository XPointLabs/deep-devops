frontend registry_public
  bind :41810 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  acl allowed method GET
  acl route path /api/network/membership-route-catalog
  http-request deny deny_status 404 unless allowed route
  default_backend registry_backend

frontend file_public
  bind :41821 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  acl allowed_method method GET POST PUT
  acl allowed_route path /file /files /session_version /token_info
  acl allowed_prefix path_beg /file/ /files/ /avatar/
  http-request deny deny_status 404 unless allowed_method allowed_route or allowed_method allowed_prefix
  default_backend file_backend

frontend push_public
  bind :41822 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  acl post method POST
  acl route path /subscribe /unsubscribe
  http-request deny deny_status 404 unless post route
  default_backend push_backend

frontend calls_public
  bind :41823 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  acl post method POST
  acl get method GET
  acl signal path /api/calls/signal
  acl inbox path_beg /api/calls/inbox/
  acl ice path_beg /api/calls/ice-servers/
  http-request deny deny_status 404 unless post signal or get inbox or get ice
  default_backend registry_backend

resolvers docker
  nameserver docker_dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s
  hold obsolete 10s
  hold nx 1s
  hold other 1s
  hold refused 1s

defaults backend_defaults
  log global
  mode http
  option dontlognull
  timeout connect 5s
  timeout client 60s
  timeout server 60s

backend xnode_1_backend
  http-response del-header Date
  http-response del-header Server
  http-response set-header Cache-Control no-store
  server xnode-1 "$DEEP_UAT_XNODE_1_UPSTREAM" proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
