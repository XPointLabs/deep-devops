  http-response del-header Date
  http-response del-header Server
  http-response set-header Cache-Control no-store
  server xnode-1 "$DEEP_UAT_XNODE_1_UPSTREAM" proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
