global
  log stdout format raw local0 info
  user haproxy
  group haproxy
  maxconn 2048
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
  ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
  ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

defaults
  log global
  mode http
  option dontlognull
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend xnode_1
  bind :41801 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  default_backend xnode_1_backend
frontend xnode_2
  bind :41802 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  default_backend xnode_2_backend
frontend xnode_3
  bind :41803 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  default_backend xnode_3_backend
frontend xnode_4
  bind :41804 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  default_backend xnode_4_backend
frontend xnode_5
  bind :41805 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  default_backend xnode_5_backend
frontend xnode_6
  bind :41806 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  default_backend xnode_6_backend

frontend registry_public
  bind :41810 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  acl allowed method GET
  acl route path /api/network/membership-route-catalog
  http-request deny deny_status 404 unless allowed route
  default_backend registry_backend

frontend file_public
  bind :41821 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  acl allowed_method method GET POST PUT
  acl allowed_route path /file /files /session_version /token_info
  acl allowed_prefix path_beg /file/ /files/ /avatar/
  http-request deny deny_status 404 unless allowed_method allowed_route or allowed_method allowed_prefix
  default_backend file_backend

frontend push_public
  bind :41822 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  acl post method POST
  acl route path /subscribe /unsubscribe
  http-request deny deny_status 404 unless post route
  default_backend push_backend

frontend calls_public
  bind :41823 ssl crt /run/deep-uat-tls/server.pem alpn h2,http/1.1
  acl post method POST
  acl get method GET
  acl signal path /api/calls/signal
  acl inbox path_beg /api/calls/inbox/
  http-request deny deny_status 404 unless post signal or get inbox
  default_backend calls_backend

backend xnode_1_backend
  server xnode-1 xnode-1:8080 check
backend xnode_2_backend
  server xnode-2 xnode-2:8080 check
backend xnode_3_backend
  server xnode-3 xnode-3:8080 check
backend xnode_4_backend
  server xnode-4 xnode-4:8080 check
backend xnode_5_backend
  server xnode-5 xnode-5:8080 check
backend xnode_6_backend
  server xnode-6 xnode-6:8080 check
backend registry_backend
  server registry registry:8080 check
backend file_backend
  server file file:8080 check
backend push_backend
  server push push:8080 check
backend calls_backend
  server calls calls:8080 check
