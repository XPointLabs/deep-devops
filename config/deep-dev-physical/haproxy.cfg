global
  log stdout format raw local0 warning
  maxconn 128
  stats socket ipv4@127.0.0.1:19999 level user
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults deep_physical
  mode http
  log global
  option dontlognull
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 5s
  http-request del-header Forwarded
  http-request del-header X-Forwarded-For
  http-request del-header X-Forwarded-Host
  http-request del-header X-Forwarded-Port
  http-request del-header X-Forwarded-Proto
  http-request del-header X-Real-IP

resolvers docker
  nameserver docker 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s
  hold nx 1s
  hold other 1s
  hold refused 1s
  hold timeout 1s

frontend node_1
  bind :43001 ssl crt /var/lib/haproxy/node-1.pem alpn h2
  http-request deny deny_status 404 unless { ssl_fc_alpn -m str h2 }
  acl post method POST
  acl get method GET
  acl frame path /api/ingress/v1/frame
  acl capability path /api/ingress/v1/capabilities
  acl peer path /api/peer/privacy/v1/frame /api/peer/contact-replica/v1/execute /api/peer/group-control/v1/execute /api/peer/mailbox/v2/store /api/peer/mailbox/v2/tombstone
  http-request deny deny_status 404 unless post frame or get capability or post peer
  use_backend node_1_peer if post peer
  default_backend node_1_public

frontend node_2
  bind :43002 ssl crt /var/lib/haproxy/node-2.pem alpn h2
  http-request deny deny_status 404 unless { ssl_fc_alpn -m str h2 }
  acl post method POST
  acl get method GET
  acl frame path /api/ingress/v1/frame
  acl capability path /api/ingress/v1/capabilities
  acl peer path /api/peer/privacy/v1/frame /api/peer/contact-replica/v1/execute /api/peer/group-control/v1/execute /api/peer/mailbox/v2/store /api/peer/mailbox/v2/tombstone
  http-request deny deny_status 404 unless post frame or get capability or post peer
  use_backend node_2_peer if post peer
  default_backend node_2_public

frontend node_3
  bind :43003 ssl crt /var/lib/haproxy/node-3.pem alpn h2
  http-request deny deny_status 404 unless { ssl_fc_alpn -m str h2 }
  acl post method POST
  acl get method GET
  acl frame path /api/ingress/v1/frame
  acl capability path /api/ingress/v1/capabilities
  acl peer path /api/peer/privacy/v1/frame /api/peer/contact-replica/v1/execute /api/peer/group-control/v1/execute /api/peer/mailbox/v2/store /api/peer/mailbox/v2/tombstone
  http-request deny deny_status 404 unless post frame or get capability or post peer
  use_backend node_3_peer if post peer
  default_backend node_3_public

# Frontend-only header rules must not be inherited by backend sections.
defaults deep_backend
  mode http
  log global
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 5s

backend node_1_public
  http-request set-uri http://%[req.hdr(host)]%[pathq]
  http-request set-header X-Forwarded-Proto https
  http-response del-header Date
  http-response del-header Server
  http-response set-header Cache-Control no-store
  server node node-1:8082 proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
backend node_2_public
  http-request set-uri http://%[req.hdr(host)]%[pathq]
  http-request set-header X-Forwarded-Proto https
  http-response del-header Date
  http-response del-header Server
  http-response set-header Cache-Control no-store
  server node node-2:8082 proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
backend node_3_public
  http-request set-uri http://%[req.hdr(host)]%[pathq]
  http-request set-header X-Forwarded-Proto https
  http-response del-header Date
  http-response del-header Server
  http-response set-header Cache-Control no-store
  server node node-3:8082 proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none

backend node_1_peer
  server node node-1:443 ssl verify required ca-file /run/public/dev-ca.crt crl-file /var/lib/haproxy/dev-ca.crl.pem sni str(node-1) verifyhost node-1 alpn h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
backend node_2_peer
  server node node-2:443 ssl verify required ca-file /run/public/dev-ca.crt crl-file /var/lib/haproxy/dev-ca.crl.pem sni str(node-2) verifyhost node-2 alpn h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
backend node_3_peer
  server node node-3:443 ssl verify required ca-file /run/public/dev-ca.crt crl-file /var/lib/haproxy/dev-ca.crl.pem sni str(node-3) verifyhost node-3 alpn h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
