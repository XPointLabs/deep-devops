global
  log stdout format raw local0 info
  user haproxy
  group haproxy
  maxconn 2048
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
  ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
  ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

defaults deep_http
  log global
  mode http
  option dontlognull
  option http-buffer-request
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  http-request del-header Forwarded
  http-request del-header X-Forwarded-For
  http-request del-header X-Forwarded-Host
  http-request del-header X-Forwarded-Port
  http-request del-header X-Forwarded-Proto
  http-request del-header X-Real-IP
  http-request deny deny_status 413 if { req.hdr(content-length) -m int gt 33554432 }

frontend xnode_1_public
  bind :43001 ssl crt /run/deep-tls/server.pem alpn h2,http/1.1
  acl get method GET
  acl post method POST
  acl metadata_path path /api/bootstrap/client /api/network/privacy-contact /api/network/membership-route-catalog
  acl privacy_path path /api/peer/privacy/v1/frame
  acl ingress_path path /api/ingress/v1/frame
  http-request set-header X-Forwarded-Proto https if post ingress_path
  http-request deny deny_status 404 unless get metadata_path or post privacy_path or post ingress_path
  use_backend xnode_1_metadata if get metadata_path
  use_backend xnode_1_privacy if post privacy_path
  use_backend xnode_1_ingress if post ingress_path

frontend xnode_2_public
  bind :43002 ssl crt /run/deep-tls/server.pem alpn h2,http/1.1
  acl get method GET
  acl post method POST
  acl metadata_path path /api/bootstrap/client /api/network/privacy-contact /api/network/membership-route-catalog
  acl privacy_path path /api/peer/privacy/v1/frame
  acl ingress_path path /api/ingress/v1/frame
  http-request set-header X-Forwarded-Proto https if post ingress_path
  http-request deny deny_status 404 unless get metadata_path or post privacy_path or post ingress_path
  use_backend xnode_2_metadata if get metadata_path
  use_backend xnode_2_privacy if post privacy_path
  use_backend xnode_2_ingress if post ingress_path

frontend xnode_3_public
  bind :43003 ssl crt /run/deep-tls/server.pem alpn h2,http/1.1
  acl get method GET
  acl post method POST
  acl metadata_path path /api/bootstrap/client /api/network/privacy-contact /api/network/membership-route-catalog
  acl privacy_path path /api/peer/privacy/v1/frame
  acl ingress_path path /api/ingress/v1/frame
  http-request set-header X-Forwarded-Proto https if post ingress_path
  http-request deny deny_status 404 unless get metadata_path or post privacy_path or post ingress_path
  use_backend xnode_3_metadata if get metadata_path
  use_backend xnode_3_privacy if post privacy_path
  use_backend xnode_3_ingress if post ingress_path

frontend registry_public
  bind :43010 ssl crt /run/deep-tls/server.pem alpn h2,http/1.1
  acl get method GET
  acl post method POST
  acl directory_get path /api/v1/directory/manifest /api/v1/directory/head /api/network/membership-route-catalog
  acl directory_generation path_reg ^/api/v1/directory/generations/[0-9]+$
  acl contact_post path /api/v1/directory/contact-resolve-packages /api/v1/directory/current-values /api/v1/contact-route-closures
  http-request set-header X-Forwarded-For %[src]
  http-request set-header X-Forwarded-Proto https
  http-request deny deny_status 404 unless get directory_get or get directory_generation or post contact_post
  default_backend registry_backend

defaults backend_defaults
  log global
  mode http
  option dontlognull
  timeout connect 5s
  timeout client 60s
  timeout server 60s

resolvers docker
  nameserver docker_dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s
  hold obsolete 10s
  hold nx 1s
  hold other 1s
  hold refused 1s

backend xnode_1_metadata
  server xnode-1 xnode-1:8080 check resolvers docker resolve-prefer ipv4 init-addr libc,none
backend xnode_2_metadata
  server xnode-2 xnode-2:8080 check resolvers docker resolve-prefer ipv4 init-addr libc,none
backend xnode_3_metadata
  server xnode-3 xnode-3:8080 check resolvers docker resolve-prefer ipv4 init-addr libc,none

backend xnode_1_ingress
  server xnode-1 xnode-1:8082 proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
backend xnode_2_ingress
  server xnode-2 xnode-2:8082 proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
backend xnode_3_ingress
  server xnode-3 xnode-3:8082 proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none

backend xnode_1_privacy
  server xnode-1 xnode-1:8083 proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
backend xnode_2_privacy
  server xnode-2 xnode-2:8083 proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none
backend xnode_3_privacy
  server xnode-3 xnode-3:8083 proto h2 check resolvers docker resolve-prefer ipv4 init-addr libc,none

backend registry_backend
  server registry registry:8080 check resolvers docker resolve-prefer ipv4 init-addr libc,none
