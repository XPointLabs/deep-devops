name: xpoint-node-prod

services:
  ingress-preflight:
    image: ${DEEP_STORAGE_SERVICE_IMAGE:?set DEEP_STORAGE_SERVICE_IMAGE}
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 96m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
    entrypoint: ["node"]
    command:
      - /opt/deep/production-ingress-spki.mjs
      - --profile
      - ${DEEP_INGRESS_CERTIFICATE_PROFILE:?set DEEP_INGRESS_CERTIFICATE_PROFILE}
      - --host
      - ${DEEP_INGRESS_HOST:?set DEEP_INGRESS_HOST}
      - --current-cert
      - /run/secrets/ingress-current.crt
      - --current-key
      - /run/secrets/ingress-current.key
      - --current-pin
      - /run/secrets/ingress-current.spki-sha256
      - --next-cert
      - /run/secrets/ingress-next.crt
      - --next-key
      - /run/secrets/ingress-next.key
      - --next-pin
      - /run/secrets/ingress-next.spki-sha256
      - --client-timeout-seconds
      - ${DEEP_INGRESS_CLIENT_TIMEOUT_SECONDS:-30}
      - --server-timeout-seconds
      - ${DEEP_INGRESS_SERVER_TIMEOUT_SECONDS:-30}
      - --quorum-cidr
      - ${DEEP_QUORUM_COORDINATOR_CIDR:?set DEEP_QUORUM_COORDINATOR_CIDR}
      - --attestation-output
      - /run/ingress-attestation/preflight.v1
    volumes:
      - ./scripts/production-ingress-spki.mjs:/opt/deep/production-ingress-spki.mjs:ro
      - ingress-preflight-attestation:/run/ingress-attestation
    secrets:
      - source: ingress-current-cert
        target: ingress-current.crt
        mode: 0444
      - source: ingress-current-key
        target: ingress-current.key
        mode: 0400
      - source: ingress-current-spki
        target: ingress-current.spki-sha256
        mode: 0444
      - source: ingress-next-cert
        target: ingress-next.crt
        mode: 0444
      - source: ingress-next-key
        target: ingress-next.key
        mode: 0400
      - source: ingress-next-spki
        target: ingress-next.spki-sha256
        mode: 0444

  ingress:
    image: ${DEEP_INGRESS_IMAGE:-haproxy:3.2.22-alpine3.24@sha256:79799e8b2977e60802774fa53d29e6b54e045402cdd8a8b9fe43923e7095a047}
    restart: unless-stopped
    init: true
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${DEEP_INGRESS_MEMORY_LIMIT:-128m}
    cpus: ${DEEP_INGRESS_CPU_LIMIT:-0.50}
    tmpfs:
      - /var/lib/haproxy:size=1m,mode=0700
    logging:
      driver: json-file
      options:
        max-size: ${DEEP_DOCKER_LOG_MAX_SIZE:-50m}
        max-file: ${DEEP_DOCKER_LOG_MAX_FILE:-5}
    environment:
      DEEP_INGRESS_CERTIFICATE_PROFILE: ${DEEP_INGRESS_CERTIFICATE_PROFILE:?set DEEP_INGRESS_CERTIFICATE_PROFILE}
      DEEP_INGRESS_HOST: ${DEEP_INGRESS_HOST:?set DEEP_INGRESS_HOST}
      DEEP_NODE_REALITY_SERVER_NAME: ${DEEP_NODE_REALITY_SERVER_NAME:?set DEEP_NODE_REALITY_SERVER_NAME}
      DEEP_INGRESS_MAX_BODY_BYTES: ${DEEP_INGRESS_MAX_BODY_BYTES:-1048576}
      DEEP_INGRESS_CLIENT_TIMEOUT_SECONDS: ${DEEP_INGRESS_CLIENT_TIMEOUT_SECONDS:-30}
      DEEP_INGRESS_SERVER_TIMEOUT_SECONDS: ${DEEP_INGRESS_SERVER_TIMEOUT_SECONDS:-30}
      DEEP_QUORUM_COORDINATOR_CIDR: ${DEEP_QUORUM_COORDINATOR_CIDR:?set DEEP_QUORUM_COORDINATOR_CIDR}
    entrypoint: ["/bin/sh", "/usr/local/bin/deep-ingress-entrypoint.sh"]
    ports:
      - "${DEEP_INGRESS_HTTPS_BIND:-443}:443"
    volumes:
      - ./config/production-ingress/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
      - ./scripts/production-ingress-entrypoint.sh:/usr/local/bin/deep-ingress-entrypoint.sh:ro
      - ingress-preflight-attestation:/run/ingress-attestation:ro
    secrets:
      - source: ingress-current-cert
        target: ingress-current.crt
        mode: 0444
      - source: ingress-current-key
        target: ingress-current.key
        mode: 0400
      - source: ingress-current-spki
        target: ingress-current.spki-sha256
        mode: 0444
    networks:
      ingress-upstream:
        ipv4_address: 172.31.241.2
      public-edge: {}
    depends_on:
      ingress-preflight:
        condition: service_completed_successfully
      xnode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -q -f /var/lib/haproxy/haproxy.cfg && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  xnode:
    image: ${XNODE_IMAGE:?set XNODE_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${DEEP_DOCKER_LOG_MAX_SIZE:-50m}
        max-file: ${DEEP_DOCKER_LOG_MAX_FILE:-5}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:8080;http://127.0.0.1:8081;http://172.31.241.10:8080;http://172.31.241.10:8081

      Node__ApiListenUrl: http://172.31.241.10:8080
      Node__PeerRpcListenUrl: http://172.31.241.10:8081
      Node__DataDirectory: /var/lib/xnode
      Node__RouterId: ${DEEP_NODE_ED25519_PUBLIC_KEY:?set DEEP_NODE_ED25519_PUBLIC_KEY}
      Node__Ed25519PrivateKeyPath: /run/secrets/node-ed25519-private-key
      Node__IsRelay: "true"
      Node__Network: ${DEEP_NETWORK:-mainnet}
      Node__PublicHost: ${DEEP_NODE_PUBLIC_HOST:?set DEEP_NODE_PUBLIC_HOST}
      Node__PublicIp: ${DEEP_NODE_PUBLIC_IP:?set DEEP_NODE_PUBLIC_IP}
      Node__PublicPort: ${DEEP_NODE_PUBLIC_PORT:-443}
      Node__QuorumCoordinatorNetworks: "172.31.241.2/32"

      PrivacyRouting__Enabled: "true"
      PrivacyRouting__X25519PrivateKeyPath: /run/secrets/node-x25519-private-key
      PrivacyRouting__PublicPeerBaseUrl: https://${DEEP_NODE_PUBLIC_HOST:?set DEEP_NODE_PUBLIC_HOST}/
      PrivacyRouting__MaximumConcurrentRequests: ${DEEP_PRIVACY_MAXIMUM_CONCURRENT_REQUESTS:-64}
      PrivacyRouting__RequestsPerMinute: ${DEEP_PRIVACY_REQUESTS_PER_MINUTE:-600}
      PrivacyRouting__RequestTimeoutSeconds: ${DEEP_PRIVACY_REQUEST_TIMEOUT_SECONDS:-30}
      PrivacyRouting__ReplyPaddingBlockBytes: ${DEEP_PRIVACY_REPLY_PADDING_BLOCK_BYTES:-4096}
      PrivacyRouting__ReplayCapacity: ${DEEP_PRIVACY_REPLAY_CAPACITY:-100000}
      PrivacyRouting__ReplayTtlSeconds: ${DEEP_PRIVACY_REPLAY_TTL_SECONDS:-300}
      PrivacyRouting__AllowInsecureHttpPeerTransport: "false"
      PrivacyRouting__Peers__0__RouterId: ${DEEP_PRIVACY_PEER_1_ROUTER_ID:?set DEEP_PRIVACY_PEER_1_ROUTER_ID}
      PrivacyRouting__Peers__0__BaseUrl: ${DEEP_PRIVACY_PEER_1_BASE_URL:?set DEEP_PRIVACY_PEER_1_BASE_URL}
      PrivacyRouting__Peers__0__CurrentSpkiSha256: ${DEEP_PRIVACY_PEER_1_CURRENT_SPKI_SHA256:?set DEEP_PRIVACY_PEER_1_CURRENT_SPKI_SHA256}
      PrivacyRouting__Peers__0__NextSpkiSha256: ${DEEP_PRIVACY_PEER_1_NEXT_SPKI_SHA256:?set DEEP_PRIVACY_PEER_1_NEXT_SPKI_SHA256}
      PrivacyRouting__Peers__1__RouterId: ${DEEP_PRIVACY_PEER_2_ROUTER_ID:?set DEEP_PRIVACY_PEER_2_ROUTER_ID}
      PrivacyRouting__Peers__1__BaseUrl: ${DEEP_PRIVACY_PEER_2_BASE_URL:?set DEEP_PRIVACY_PEER_2_BASE_URL}
      PrivacyRouting__Peers__1__CurrentSpkiSha256: ${DEEP_PRIVACY_PEER_2_CURRENT_SPKI_SHA256:?set DEEP_PRIVACY_PEER_2_CURRENT_SPKI_SHA256}
      PrivacyRouting__Peers__1__NextSpkiSha256: ${DEEP_PRIVACY_PEER_2_NEXT_SPKI_SHA256:?set DEEP_PRIVACY_PEER_2_NEXT_SPKI_SHA256}
      PrivacyRouting__Peers__2__RouterId: ${DEEP_PRIVACY_PEER_3_ROUTER_ID:?set DEEP_PRIVACY_PEER_3_ROUTER_ID}
      PrivacyRouting__Peers__2__BaseUrl: ${DEEP_PRIVACY_PEER_3_BASE_URL:?set DEEP_PRIVACY_PEER_3_BASE_URL}
      PrivacyRouting__Peers__2__CurrentSpkiSha256: ${DEEP_PRIVACY_PEER_3_CURRENT_SPKI_SHA256:?set DEEP_PRIVACY_PEER_3_CURRENT_SPKI_SHA256}
      PrivacyRouting__Peers__2__NextSpkiSha256: ${DEEP_PRIVACY_PEER_3_NEXT_SPKI_SHA256:?set DEEP_PRIVACY_PEER_3_NEXT_SPKI_SHA256}

      StorageRpc__BaseUrl: http://172.31.241.20:8080

      Vless__Enabled: "true"
      Vless__MockProcess: "false"
      Vless__XrayExecutablePath: /usr/local/bin/xray
      Vless__GeneratedConfigPath: /etc/xnode/xray.generated.json
      Vless__WorkingDirectory: /var/lib/xnode/xray
      Vless__InboundListenHost: 0.0.0.0
      Vless__InboundListenPort: ${DEEP_NODE_VLESS_CONTAINER_PORT:-443}
      Vless__PublicHost: ${DEEP_NODE_PUBLIC_HOST:?set DEEP_NODE_PUBLIC_HOST}
      Vless__PublicPort: ${DEEP_NODE_PUBLIC_PORT:-443}
      Vless__ApiIngressHost: 172.31.241.10
      Vless__ApiIngressPort: "8080"
      Vless__ClientId: ${DEEP_NODE_VLESS_CLIENT_ID:?set DEEP_NODE_VLESS_CLIENT_ID}
      Vless__MaskDomain: ${DEEP_NODE_MASK_DOMAIN:-www.microsoft.com}
      Vless__TransportMode: Reality
      Vless__Reality__ServerName: ${DEEP_NODE_REALITY_SERVER_NAME:-www.microsoft.com}
      Vless__Reality__PublicKey: ${DEEP_NODE_REALITY_PUBLIC_KEY:?set DEEP_NODE_REALITY_PUBLIC_KEY}
      Vless__Reality__PrivateKey: ${DEEP_NODE_REALITY_PRIVATE_KEY:?set DEEP_NODE_REALITY_PRIVATE_KEY}
      Vless__Reality__ShortId: ${DEEP_NODE_REALITY_SHORT_ID:?set DEEP_NODE_REALITY_SHORT_ID}
      Vless__Reality__Fingerprint: ${DEEP_NODE_REALITY_FINGERPRINT:-chrome}
      Vless__Reality__SpiderX: ${DEEP_NODE_REALITY_SPIDER_X:-/}

      RegistryHeartbeat__Enabled: "true"
      RegistryHeartbeat__Endpoint: ${DEEP_REGISTRY_URL:?set DEEP_REGISTRY_URL}/api/nodes/register
      RegistryHeartbeat__Interval: ${DEEP_REGISTRY_HEARTBEAT_INTERVAL:-00:00:30}

      RegistryRegistration__OperatorAddress: ${DEEP_OPERATOR_ADDRESS:?set DEEP_OPERATOR_ADDRESS}
      RegistryRegistration__RewardsAddress: ${DEEP_REWARDS_ADDRESS:?set DEEP_REWARDS_ADDRESS}
      RegistryRegistration__OperatorFeeBps: ${DEEP_OPERATOR_FEE_BPS:-0}
      RegistryRegistration__StakeAtomic: "25000000000000"
      RegistryRegistration__ChainId: ${DEEP_ARBITRUM_CHAIN_ID:-42161}
      RegistryRegistration__Ed25519PublicKey: ${DEEP_NODE_ED25519_PUBLIC_KEY:?set DEEP_NODE_ED25519_PUBLIC_KEY}
      RegistryRegistration__Ed25519Signature: ${DEEP_NODE_ED25519_SIGNATURE:-}
      RegistryRegistration__BlsPrivateKeyPath: /run/secrets/node-bls-private-key
      RegistryRegistration__EthereumRpcUrl: ${DEEP_ARBITRUM_RPC_URL:-https://arb1.arbitrum.io/rpc}
      RegistryRegistration__EthereumFallbackRpcUrls: ${DEEP_ARBITRUM_FALLBACK_RPC_URLS:-https://arb1.arbitrum.io/rpc}
      RegistryRegistration__ServiceNodeRewardsAddress: ${DEEP_SERVICE_NODE_REWARDS_ADDRESS:?set DEEP_SERVICE_NODE_REWARDS_ADDRESS}
      RegistryRegistration__EnforceQuorumSigningPolicy: ${DEEP_ENFORCE_QUORUM_SIGNING_POLICY:-true}
      RegistryRegistration__QuorumPolicyBackendBaseUrl: ${DEEP_STAKING_BACKEND_URL:?set DEEP_STAKING_BACKEND_URL}
      RegistryRegistration__QuorumPolicyBackendTimeoutSeconds: ${DEEP_QUORUM_POLICY_BACKEND_TIMEOUT_SECONDS:-5}
      RegistryRegistration__MaxRewardSignatureIncreaseAtomic: ${DEEP_MAX_REWARD_SIGNATURE_INCREASE_ATOMIC:-100000000000000}
      RegistryRegistration__MaxQuorumSignatureTimestampSkewSeconds: ${DEEP_MAX_QUORUM_SIGNATURE_TIMESTAMP_SKEW_SECONDS:-300}
    expose:
      - "${DEEP_NODE_VLESS_CONTAINER_PORT:-443}"
      - "8080"
      - "8081"
    volumes:
      - xnode-state:/var/lib/xnode
      - xnode-config:/etc/xnode
    secrets:
      - source: node-ed25519-private-key
        target: node-ed25519-private-key
      - source: node-x25519-private-key
        target: node-x25519-private-key
      - source: node-bls-private-key
        target: node-bls-private-key
    networks:
      ingress-upstream:
        ipv4_address: 172.31.241.10
      node-egress: {}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://172.31.241.10:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  storage-service:
    image: ${DEEP_STORAGE_SERVICE_IMAGE:?set DEEP_STORAGE_SERVICE_IMAGE}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${DEEP_DOCKER_LOG_MAX_SIZE:-50m}
        max-file: ${DEEP_DOCKER_LOG_MAX_FILE:-5}
    environment:
      PORT: "8080"
      LISTEN_HOST: 172.31.241.20
      SERVICE_NAME: deep-storage-service
      COMPAT_STATE_DIR: /var/lib/deep/storage-service
      PUSH_COMPAT_NOTIFY_URL: ${DEEP_PUSH_NOTIFY_URL:-}
      PUSH_COMPAT_NOTIFY_NODE_ID: ${DEEP_NODE_ED25519_PUBLIC_KEY:?set DEEP_NODE_ED25519_PUBLIC_KEY}
      PUSH_COMPAT_NOTIFY_ED25519_PRIVATE_KEY_FILE: /run/secrets/node-ed25519-private-key
      STORAGE_MAX_REQUEST_BYTES: ${DEEP_STORAGE_MAX_REQUEST_BYTES:-262144}
      STORAGE_MAX_MESSAGE_BYTES: ${DEEP_STORAGE_MAX_MESSAGE_BYTES:-65536}
      STORAGE_MAX_MESSAGES_PER_ACCOUNT: ${DEEP_STORAGE_MAX_MESSAGES_PER_ACCOUNT:-10000}
      STORAGE_MAX_BYTES_PER_ACCOUNT: ${DEEP_STORAGE_MAX_BYTES_PER_ACCOUNT:-268435456}
      STORAGE_MAX_MESSAGES: ${DEEP_STORAGE_MAX_MESSAGES:-100000}
      STORAGE_MAX_BYTES: ${DEEP_STORAGE_MAX_BYTES:-2147483648}
      STORAGE_RETRIEVE_PAGE_SIZE: ${DEEP_STORAGE_RETRIEVE_PAGE_SIZE:-100}
      STORAGE_MAX_RETRIEVE_PAGE_BYTES: ${DEEP_STORAGE_MAX_RETRIEVE_PAGE_BYTES:-1048576}
      STORAGE_RATE_LIMIT_PER_MINUTE: ${DEEP_STORAGE_RATE_LIMIT_PER_MINUTE:-600}
      STORAGE_SNAPSHOT_EVERY_MUTATIONS: ${DEEP_STORAGE_SNAPSHOT_EVERY_MUTATIONS:-100}
    expose:
      - "8080"
    volumes:
      - node-storage-state:/var/lib/deep/storage-service
    secrets:
      - source: node-ed25519-private-key
        target: node-ed25519-private-key
    networks:
      ingress-upstream:
        ipv4_address: 172.31.241.20
      node-egress: {}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://172.31.241.20:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  xnode-state:
  xnode-config:
  node-storage-state:
  ingress-preflight-attestation:

networks:
  public-edge: {}
  ingress-upstream:
    internal: true
    ipam:
      config:
        - subnet: 172.31.241.0/24
  node-egress: {}

secrets:
  ingress-current-cert:
    file: ${DEEP_INGRESS_CURRENT_CERT_FILE:?set DEEP_INGRESS_CURRENT_CERT_FILE}
  ingress-current-key:
    file: ${DEEP_INGRESS_CURRENT_KEY_FILE:?set DEEP_INGRESS_CURRENT_KEY_FILE}
  ingress-next-cert:
    file: ${DEEP_INGRESS_NEXT_CERT_FILE:?set DEEP_INGRESS_NEXT_CERT_FILE}
  ingress-next-key:
    file: ${DEEP_INGRESS_NEXT_KEY_FILE:?set DEEP_INGRESS_NEXT_KEY_FILE}
  ingress-current-spki:
    file: ${DEEP_INGRESS_CURRENT_SPKI_FILE:?set DEEP_INGRESS_CURRENT_SPKI_FILE}
  ingress-next-spki:
    file: ${DEEP_INGRESS_NEXT_SPKI_FILE:?set DEEP_INGRESS_NEXT_SPKI_FILE}
  node-ed25519-private-key:
    file: ${DEEP_NODE_ED25519_PRIVATE_KEY_FILE:?set DEEP_NODE_ED25519_PRIVATE_KEY_FILE}
  node-x25519-private-key:
    file: ${DEEP_NODE_X25519_PRIVATE_KEY_FILE:?set DEEP_NODE_X25519_PRIVATE_KEY_FILE}
  node-bls-private-key:
    file: ${DEEP_NODE_BLS_PRIVATE_KEY_FILE:?set DEEP_NODE_BLS_PRIVATE_KEY_FILE}
