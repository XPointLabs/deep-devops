name: xpoint-client-services-prod

x-prod-logging: &prod-logging
  driver: json-file
  options:
    max-size: ${DEEP_DOCKER_LOG_MAX_SIZE:-50m}
    max-file: ${DEEP_DOCKER_LOG_MAX_FILE:-5}

services:
  storage-service:
    build:
      context: .
      dockerfile: docker/storage-service.Dockerfile
    restart: unless-stopped
    logging: *prod-logging
    environment:
      PORT: "8080"
      SERVICE_NAME: deep-storage-service
      COMPAT_STATE_DIR: /var/lib/deep/storage-service
      PUSH_COMPAT_NOTIFY_URL: http://push-service:8080/_compat/push-notify
      PUSH_COMPAT_NOTIFY_BEARER_TOKEN_FILE: /run/secrets/push-internal-token
      STORAGE_MAX_REQUEST_BYTES: ${DEEP_STORAGE_MAX_REQUEST_BYTES:-262144}
      STORAGE_MAX_MESSAGE_BYTES: ${DEEP_STORAGE_MAX_MESSAGE_BYTES:-65536}
      STORAGE_MAX_MESSAGES_PER_ACCOUNT: ${DEEP_STORAGE_MAX_MESSAGES_PER_ACCOUNT:-10000}
      STORAGE_MAX_BYTES_PER_ACCOUNT: ${DEEP_STORAGE_MAX_BYTES_PER_ACCOUNT:-268435456}
      STORAGE_MAX_MESSAGES: ${DEEP_STORAGE_MAX_MESSAGES:-100000}
      STORAGE_MAX_BYTES: ${DEEP_STORAGE_MAX_BYTES:-2147483648}
      STORAGE_RETRIEVE_PAGE_SIZE: ${DEEP_STORAGE_RETRIEVE_PAGE_SIZE:-100}
      STORAGE_MAX_RETRIEVE_PAGE_BYTES: ${DEEP_STORAGE_MAX_RETRIEVE_PAGE_BYTES:-1048576}
      STORAGE_RATE_LIMIT_PER_MINUTE: ${DEEP_STORAGE_RATE_LIMIT_PER_MINUTE:-600}
      STORAGE_SNAPSHOT_EVERY_MUTATIONS: ${DEEP_STORAGE_SNAPSHOT_EVERY_MUTATIONS:-100}
    volumes:
      - storage-service-state:/var/lib/deep/storage-service
    ports:
      - "127.0.0.1:19100:8080"
    secrets:
      - push-internal-token
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 3s
      retries: 30

  file-service:
    build:
      context: .
      dockerfile: docker/file-service.Dockerfile
    restart: unless-stopped
    logging: *prod-logging
    environment:
      PORT: "8080"
      SERVICE_NAME: deep-file-service
      COMPAT_STATE_DIR: /var/lib/deep/file-service
    volumes:
      - file-service-state:/var/lib/deep/file-service
    ports:
      - "127.0.0.1:19101:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 3s
      retries: 30

  push-service:
    image: ${DEEP_PUSH_SERVER_IMAGE:-xpoint/deep-push-notification-server:prod}
    restart: unless-stopped
    logging: *prod-logging
    depends_on:
      push-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Host: push-db
      Database__Name: deep_push
      Database__Username: deep_push
      Database__PasswordFile: /run/secrets/push-db-password
      Push__FirebaseCredentialsPath: /run/secrets/firebase-service-account.json
      Push__InternalTokenFile: /run/secrets/push-internal-token
      Push__RegistryUrl: https://registry.xpoint.network
    secrets:
      - push-db-password
      - push-internal-token
      - source: firebase-service-account
        target: firebase-service-account.json
    ports:
      - "127.0.0.1:19102:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30

  push-db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *prod-logging
    environment:
      POSTGRES_DB: deep_push
      POSTGRES_USER: deep_push
      POSTGRES_PASSWORD_FILE: /run/secrets/push-db-password
    volumes:
      - push-db-data:/var/lib/postgresql/data
    secrets:
      - push-db-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deep_push -d deep_push"]
      interval: 3s
      timeout: 3s
      retries: 30

  turn-service:
    image: coturn/coturn:4.12.0-alpine@sha256:faca4aa57efc436916c31546f3867bd1a3fb1077723291bcfba0bf814bcaf48a
    restart: unless-stopped
    logging: *prod-logging
    network_mode: host
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/usr/local/bin/deep-coturn-entrypoint"]
    environment:
      DEEP_TURN_PUBLIC_HOST: ${DEEP_TURN_PUBLIC_HOST:?set DEEP_TURN_PUBLIC_HOST}
      DEEP_TURN_EXTERNAL_IP: ${DEEP_TURN_EXTERNAL_IP:-auto}
      DEEP_TURN_CERT_FILE: /etc/letsencrypt/live/${DEEP_TURN_PUBLIC_HOST:?set DEEP_TURN_PUBLIC_HOST}/fullchain.pem
      DEEP_TURN_PKEY_FILE: /etc/letsencrypt/live/${DEEP_TURN_PUBLIC_HOST:?set DEEP_TURN_PUBLIC_HOST}/privkey.pem
      DEEP_TURN_SHARED_SECRET_FILE: /run/secrets/turn-shared-secret
    tmpfs:
      - /run/coturn-runtime:rw,noexec,nosuid,nodev,size=1m,mode=0700
    volumes:
      - ./config/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./scripts/coturn-entrypoint.sh:/usr/local/bin/deep-coturn-entrypoint:ro
      - ${DEEP_TURN_CERT_ROOT:-/etc/letsencrypt}:/etc/letsencrypt:ro
    secrets:
      - turn-shared-secret
    healthcheck:
      test: ["CMD-SHELL", "pidof turnserver >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  storage-service-state:
  file-service-state:
  push-db-data:

secrets:
  push-db-password:
    file: ${DEEP_PUSH_DB_PASSWORD_FILE:-./secrets/push-db-password}
  push-internal-token:
    file: ${DEEP_PUSH_INTERNAL_TOKEN_FILE:-./secrets/push-internal-token}
  firebase-service-account:
    file: ${DEEP_FIREBASE_SERVICE_ACCOUNT_FILE:-./secrets/firebase-service-account.json}
  turn-shared-secret:
    file: ${DEEP_TURN_SHARED_SECRET_FILE:-./secrets/turn-shared-secret}
